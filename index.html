:root{
  --paper:#F2F2F4; --panel:#FFFFFF; --ink:#111113; --muted:#6B6B73; --line:#E2E2E7;
  --green:#E11D2E; --green-d:#A50F1D; --leaf:#FCE7E9; --ok:#15803D; --ok-l:#E7F6EC;
  --yellow:#E11D2E; --yellow-l:#FDEDEF;
  --brick:#C2410C; --brick-l:#FFF1E6;
  --disp:'Chakra Petch',system-ui,sans-serif; --body:'Anuphan',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
input,select,textarea{font-size:max(16px,1em)}
body{margin:0;touch-action:manipulation;font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.55;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- หัวเว็บ ---------- */
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.hwrap{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(225,29,46,.45);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand h1{font-family:var(--disp);font-size:19px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlink{background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:5px 13px;font-size:15px;white-space:nowrap}
.back{background:none;border:0;color:#fff;padding:4px 6px 4px 0;display:flex}
main{max-width:560px;margin:0 auto;padding:22px 16px 130px}
main.wide{max-width:920px}

/* ---------- ตัวอักษร ---------- */
.title{font-family:var(--disp);font-size:28px;font-weight:600;line-height:1.2;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 22px}
.small{font-size:14px;color:var(--muted)}
.demo{background:var(--yellow-l);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:20px;color:#9F1239}
.demo a{color:inherit}

/* ---------- มิเตอร์เลขไมล์ (จุดเด่นของหน้า) ---------- */
.odo{display:inline-flex;gap:3px;padding:4px;background:var(--ink);border-radius:8px;font-family:var(--disp);font-weight:700;vertical-align:middle}
.odo i{font-style:normal;width:1.05em;text-align:center;background:linear-gradient(#2B2B30,#1E1E22 48%,#141416 52%,#26262B);color:#F5F5F7;border-radius:3px;line-height:1.55;font-variant-numeric:tabular-nums}
.odo i.z{color:#5A5A62}
.odo .u{font-family:var(--body);font-weight:500;font-size:.55em;color:#9A9AA3;align-self:center;padding:0 4px 0 3px}
.odo.sm{font-size:17px}
.odo.lg{font-size:clamp(24px,8.4vw,34px);padding:6px;gap:4px;border-radius:12px}
.odo.lg i{border-radius:5px}
.odo.hl i{background:linear-gradient(#EF3341,#E11D2E 48%,#C81627 52%,#D61B2B);color:#fff}
.odo.hl i.z{color:#F4A3AB}
.odo.hl{background:#A50F1D}
.odo.hl .u{color:#FDD5D9}
.route .odo.lg,.done-box .odo.lg{font-size:clamp(22px,7vw,30px)}
.compare .odo.sm{font-size:16px}.compare .odo .u{display:none}
.odo-in{position:relative;display:flex;justify-content:center;padding:4px 0}
.odo-in input{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;cursor:text}
.odo-in:focus-within .odo{box-shadow:0 0 0 4px var(--yellow)}
.odo-in.empty .odo i{color:#5A5A62}

/* ---------- ป้ายทะเบียน ---------- */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:7px;padding:3px 12px 2px;line-height:1.15;min-width:118px}
.plate b{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.5px}
.plate span{font-size:11px;color:var(--ink)}

/* ---------- รายการรถหน้าแรก ---------- */
.cars{display:grid;gap:14px}
.car{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(17,17,19,.04),0 8px 24px -12px rgba(17,17,19,.12)}
.car.mine{border:2px solid var(--green);background:linear-gradient(160deg,#FFF5F6,#fff 60%)}
.car-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.car h2{font-family:var(--disp);font-size:20px;font-weight:600;margin:12px 0 2px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:500;white-space:nowrap;padding-top:4px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.free{color:var(--ok)}.status.busy{color:var(--muted)}.status.mine{color:var(--green-d)}
.car .who{color:var(--muted);font-size:15px;margin:0}
.car .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 16px}

/* ---------- ปุ่ม ---------- */
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font-family:var(--disp);font-weight:600;font-size:19px;background:var(--green);color:#fff;box-shadow:0 6px 16px -6px rgba(225,29,46,.55);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.line,.btn.soft,.btn.sm.line{box-shadow:none}
.btn:active{background:var(--green-d)}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:var(--leaf);color:var(--green-d)}
.btn.sm{width:auto;padding:9px 14px;font-size:16px;border-radius:10px}
.btn:disabled{opacity:.55}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);z-index:4}
.dock .btn{max-width:528px;margin:0 auto}

/* ---------- ขั้นตอนแบบเส้นต่อ ---------- */
.ctx{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.ctx .t{font-family:var(--disp);font-size:22px;font-weight:600;line-height:1.2}
.steps{margin:0;padding:0;list-style:none}
.st{position:relative;padding:0 0 30px 46px}
.st::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.st.done .dot{background:var(--green);border-color:var(--green);color:#fff;font-size:0}
.st.done .dot::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.st.done::before{background:var(--green)}
.st h3{font-family:var(--disp);font-size:19px;font-weight:600;margin:2px 0 12px;line-height:1.3}
.st h3 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
.note{font-size:15px;color:var(--muted);margin-top:10px;text-align:center}
.note.ok{color:var(--ok)}.note.warn{color:var(--brick)}

/* กล้อง */
.shot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:148px;border:2px dashed #C9C9D0;border-radius:14px;background:var(--panel);color:var(--green-d);font-weight:500;cursor:pointer}
.shot svg{width:40px;height:40px}
.shot img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.shot.has{border:0;padding:0;background:none;min-height:0}

/* ช่องกรอก */
input.f,textarea.f,select.f{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input.f:focus,textarea.f:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--leaf)}
textarea.f{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:16px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mt{margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:14px;color:var(--muted);margin-bottom:4px}

/* จุดแวะ */
.stop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stop .n{font-family:var(--disp);font-weight:700;width:26px;text-align:center;color:var(--green)}
.stop input{flex:1}
.stop .rm{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:4px 6px}
.stop .btn{flex-shrink:0}
.pick{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;background:var(--panel);border:1.5px solid var(--green);border-radius:12px;padding:10px 6px 10px 0}
.pick .n,.stop .n{padding-top:2px}
.pick .pk{flex:1;min-width:0}
.pick .pk b{display:block;font-weight:600}
.pick .pk span{display:block;font-size:13px;color:var(--muted)}
.pick .rm{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:0 8px}
.res{margin:-2px 0 12px 34px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px}
.res button:last-child{border-bottom:0}
.res button:active{background:var(--leaf)}
.res b{display:block;font-weight:600}
.res span{display:block;font-size:13px;color:var(--muted)}
.res .msg{padding:10px 14px;font-size:14px;color:var(--brick)}
.tip{font-size:13px;color:var(--muted);margin:2px 0 0 34px}
.price{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.price select{font:inherit;border:0;background:none;color:var(--ink);font-weight:500;padding:4px 0;max-width:60%}
.price b{font-family:var(--disp);font-size:22px;white-space:nowrap}
.price b small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
/* โหมดกำลังขับ */
.live{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:20px;font-weight:600;margin:0 0 12px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(225,29,46,.5);animation:pl 1.6s infinite}
.pulse.off{background:var(--brick);animation:none}
@keyframes pl{70%{box-shadow:0 0 0 12px rgba(225,29,46,0)}100%{box-shadow:0 0 0 0 rgba(225,29,46,0)}}
.trace{background:#EDEDF0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trace svg{display:block;width:100%;height:auto}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dstats>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.dstats b{display:block;font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums}
.dstats span{font-size:13px;color:var(--muted)}
.tips{font-size:14px;color:var(--muted);margin:14px 2px 0;line-height:1.6}
.gpsrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--green-d);margin:-6px 0 12px}
.gpsrow .pulse{width:9px;height:9px}
.mapov{position:fixed;inset:0;background:var(--paper);z-index:40;display:flex;flex-direction:column}
.maphead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--green-d);color:#fff}
.maphead b{flex:1;font-family:var(--disp);font-weight:600}
.maphead button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:5px 14px}
#map{flex:1;min-height:200px}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 16px;font-size:14px;background:#fff;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
/* แผนที่เต็มจอแบบแอปส่งของ */
body.fullmap header{display:none}
body.fullmap main{max-width:none;padding:0}
.mapfull{position:fixed;inset:0;background:#E8E8EC}
#lmap,#dmap{position:absolute;inset:0}
.ftop{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:700;max-width:640px}
.fbtn{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(17,17,19,.22);display:flex;align-items:center;justify-content:center}
.fchip{flex:1;min-width:0;background:#fff;border-radius:999px;padding:11px 16px;box-shadow:0 2px 10px rgba(17,17,19,.22);font-weight:600;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip .pulse{width:10px;height:10px;flex-shrink:0}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:700;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(17,17,19,.18);padding:6px 16px calc(16px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto;transition:max-height .25s}
.bsheet.min{max-height:118px;overflow:hidden}
.handle{width:44px;height:5px;border-radius:3px;background:#D4D4D8;margin:6px auto 12px;cursor:pointer}
@media (min-width:900px){.bsheet{left:16px;right:auto;top:84px;bottom:16px;width:400px;max-height:none;border-radius:18px}.bsheet.min{max-height:none}.handle{display:none}}
.ltrip{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.ltrip.sel{border-color:var(--green);box-shadow:0 0 0 3px var(--leaf)}
.lrow{display:flex;align-items:center;gap:12px}
.lrow .av{width:42px;height:42px;border-radius:50%;background:var(--leaf);color:var(--green-d);font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lwho{flex:1;min-width:0}
.lwho b{display:block;font-size:18px}
.lwho span{font-size:14px;color:var(--muted)}
.lrow .plate{min-width:0;padding:2px 8px}.lrow .plate b{font-size:15px}.lrow .plate span{font-size:9px}
.lstat{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-weight:600;font-size:16px}
.lsd{width:10px;height:10px;border-radius:50%;background:currentColor;flex-shrink:0}
.lstat.ok{color:var(--ink)}.lstat.off{color:var(--brick)}.lstat.stale,.lstat.wait{color:var(--muted)}
.stepr{display:flex;align-items:center;margin:12px 0 4px}
.sd{min-width:28px;height:28px;padding:0 6px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--muted);white-space:nowrap}
.sd.done{background:var(--green);border-color:var(--green);color:#fff}
.sd.cur{border-color:var(--green);color:var(--green-d);box-shadow:0 0 0 4px var(--leaf)}
.sl{flex:1;height:3px;background:var(--line);min-width:10px}
.sl.on{background:var(--green)}
.lmet{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.lmet b{display:block;font-family:var(--disp);font-size:20px;font-weight:600;white-space:nowrap}
.lmet span{font-size:12px;color:var(--muted)}
.lexp{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);margin-top:10px}
.lempty{text-align:center;padding:18px 8px;font-size:17px}
.bsheet .tips{margin:10px 0 12px}
.vcar{position:relative;width:64px;height:64px}
.vhalo{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(225,29,46,.16);border:1.5px solid rgba(225,29,46,.35)}
.vcar.off .vhalo{background:rgba(217,119,6,.18);border-color:rgba(217,119,6,.45);animation:halo 1.4s ease-out infinite}
.vcar.stale .vhalo{background:rgba(120,130,124,.15);border-color:rgba(120,130,124,.35)}
.vcar.me .vhalo{animation:halo 2s ease-out infinite}
@keyframes halo{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.35);opacity:0}}
.vrot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .8s ease;filter:drop-shadow(0 3px 3px rgba(10,10,12,.35))}
.vtag{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:#fff;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:12px;padding:2px 8px;border-radius:7px;border:1.5px solid var(--ink);white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.vcar.off .vtag{border-color:var(--brick);color:var(--brick)}
.pin{position:relative;width:36px;height:46px;filter:drop-shadow(0 3px 3px rgba(10,10,12,.3))}
.pin svg{display:block}
.pin b{position:absolute;left:0;right:0;top:7px;text-align:center;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink)}
.hqpin{position:relative;width:44px;height:52px;filter:drop-shadow(0 3px 3px rgba(10,10,12,.3))}
.golive{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--green-d);color:#fff;border:0;border-radius:16px;padding:16px 18px;margin-bottom:16px}
.golive b{font-family:var(--disp);font-size:20px;font-weight:600}
.golive .small{color:#D4D4D8}
.golive .go{margin-left:auto;font-size:28px}
.golive .pulse{background:var(--yellow);flex-shrink:0}
.leaflet-container{font-family:var(--body)}
.login{max-width:360px;margin:0 auto;text-align:center}
.pdots{display:flex;justify-content:center;gap:14px;margin:8px 0 4px}
.pdots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pdots i.on{background:var(--green);border-color:var(--green)}
.pdots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.keypad button{height:68px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 6px rgba(17,17,19,.06);font-family:var(--disp);font-size:28px;font-weight:600;box-shadow:0 1px 0 var(--line);display:flex;align-items:center;justify-content:center;width:66px;margin:0 auto}
.keypad button:active{background:var(--green);color:#fff;border-color:var(--green)}
.trip.fl.rv{border-left-color:var(--ok)}
.trip.rv .fx{color:#8a5a45}
.rvbox{margin-top:12px;background:var(--ok-l);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--green);font-weight:600;text-decoration:underline;padding:0 0 0 6px;font-size:14px}
.hqrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--muted);margin:-4px 2px 14px}
.hqrow b{color:var(--ink)}
.hqwarn{margin-bottom:16px}
.centerpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:600;pointer-events:none}
.hqsearch{position:absolute;top:12px;left:12px;right:12px;z-index:700;max-width:520px}
.hqsearch .f{box-shadow:0 2px 10px rgba(17,17,19,.2)}
.hqsearch .res{margin:6px 0 0}
.hqfoot{background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sbox.off{opacity:.6}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
@media (max-width:480px){.srow{grid-template-columns:1fr}}
.pinrow{display:flex;gap:6px}.pinrow .f{font-family:var(--disp);font-size:18px;letter-spacing:2px}
.tog{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:15px;cursor:pointer}
.tog .small{flex-basis:100%;padding-left:28px}
.tog input{width:20px;height:20px;accent-color:var(--green)}
.gmlink{display:block;text-align:center;margin-top:12px;font-weight:600;color:var(--green)}
/* แอปผู้ดูแล */
body.admin header{background:linear-gradient(100deg,#111113 55%,#3A0B12)}
body.admin main{padding-bottom:170px}
body.admin .dock{bottom:calc(64px + env(safe-area-inset-bottom))}
.rolechip{background:var(--green);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.atabs{display:none}
body.admin .atabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:center;box-shadow:0 -2px 12px rgba(17,17,19,.06)}
.atabs button{position:relative;flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:7px 4px;color:var(--muted);font-size:12.5px;border-radius:12px}
.atabs button.on{color:var(--green-d);font-weight:600}
.atabs button.on svg{background:var(--leaf);border-radius:999px;padding:2px 14px;box-sizing:content-box}
.tbadge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brick);color:#fff;font-style:normal;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.ocars{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:6px}
.ocar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.ocar.busy{border:2px solid var(--green)}
.ocar h3{font-family:var(--disp);font-size:19px;font-weight:600;margin:10px 0 4px}
.ocar .who{font-size:15px;color:var(--muted);margin:0 0 6px}
.ocar .who b{color:var(--ink)}
.ocar .row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 12px}
.todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--brick-l);border:1.5px solid #F7D7B5;border-radius:16px;padding:14px 16px;margin-top:16px}
.todo.clear{background:var(--ok-l);border-color:#BFE3CB}
.todo .tnum{font-family:var(--disp);font-size:30px;font-weight:700;color:var(--brick);min-width:40px;text-align:center}
.todo.clear .tnum{color:var(--ok)}
.todo .go{margin-left:auto;font-size:26px;color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.mstats>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mstats b{display:block;font-family:var(--disp);font-size:26px;font-weight:600}
.mstats span{font-size:13px;color:var(--muted)}
.seg{display:flex;background:#E6E6EB;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg i{font-style:normal;font-size:12px;background:rgba(0,0,0,.07);border-radius:9px;padding:1px 7px;margin-left:4px}
.tacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tacts:empty{display:none}
.phlink{font-size:14px;margin-right:8px}
.menuitem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font-size:17px}
.menuitem.warn{color:var(--brick)}
.applogo{display:block;width:min(300px,86%);height:auto;margin:0 auto 6px;mix-blend-mode:multiply}
.appmark{padding:0;object-fit:cover;background:none;box-shadow:none}
.brandmark{width:68px;height:68px;border-radius:20px;background:linear-gradient(145deg,#2A2A2F,#0D0D0F);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 14px;box-shadow:0 10px 24px -10px rgba(17,17,19,.6);position:relative}
.brandmark::after{content:"";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--paper)}
.instbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;background:#111113;color:#fff;border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);max-width:520px;margin:0 auto;animation:pop .3s ease-out}
.instbar .ib-ic{width:40px;height:40px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.instbar .ib-tx{flex:1;font-size:14px;line-height:1.4;color:#D4D4D8}.instbar .ib-tx b{color:#fff}
.instbar .btn{box-shadow:none}
.instbar .ib-x{background:none;border:0;color:#9A9AA3;font-size:24px;padding:0 4px}
body.admin .instbar{bottom:calc(76px + env(safe-area-inset-bottom))}
.rshot{min-height:110px;margin-top:12px}
.rstat{font-size:14px;margin-top:8px;text-align:center}
.rstat.ok{color:var(--green)}.rstat.warn{color:var(--brick)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.auto{font-size:12px;color:var(--green);margin-top:3px;min-height:16px}
.cost{margin-top:10px;font-size:15px;color:var(--muted)}
.cost b{color:var(--ink)}
.add{background:none;border:0;color:var(--green);font-weight:600;padding:6px 0 0 34px}

/* เส้นทาง */
.route{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.rt{list-style:none;margin:0;padding:0}
.rt li{position:relative;padding:0 0 0 26px}
.rt li::before{content:"";position:absolute;left:5px;top:8px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.rt li.hq::before{background:var(--green);border-radius:3px}
.rt .leg{position:relative;padding:6px 0 6px 26px;color:var(--muted);font-size:14px;font-family:var(--disp);font-weight:500}
.rt .leg::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:2px dashed #C9C9D0}
.rt .nm{font-weight:600}
.rt .ad{font-size:13px;color:var(--muted)}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.sum b{font-family:var(--disp);font-size:24px}
.expect{margin-top:14px;background:var(--yellow-l);border-radius:12px;padding:14px;text-align:center}
.expect p{margin:0 0 8px;font-size:15px}
.fake{font-size:13px;color:#9F1239;margin-top:8px}

/* คืนรถ: เทียบเลขไมล์ */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.compare>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.compare p{margin:0 0 6px;font-size:14px;color:var(--muted)}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:15px}
.plan ol{margin:4px 0 0;padding-left:22px}
.result{margin-top:14px;text-align:center}
.result .km{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1.1}
.verdict{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:15px}
.verdict.ok{background:var(--ok-l);color:var(--ok)}
.verdict.warn{background:var(--brick-l);color:var(--brick)}

/* ชื่อผู้ใช้ */
.people{display:grid;gap:10px}
.person{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:19px;font-weight:500;text-align:left}
.person .av{width:42px;height:42px;border-radius:50%;background:var(--leaf);color:var(--green-d);font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center}

/* เสร็จ */
.done-box{text-align:center;padding-top:20px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--green);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease-out}
.tick::after{content:"";width:22px;height:40px;border:solid #fff;border-width:0 6px 6px 0;transform:rotate(45deg) translate(-3px,-4px)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.flags{list-style:none;padding:0;margin:20px 0 0;text-align:left}
.flags li{border-left:4px solid var(--brick);background:var(--brick-l);color:#9A3412;padding:10px 12px;border-radius:0 10px 10px 0;font-size:15px;margin-top:8px}

/* รายงาน */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar input{width:auto;padding:9px 12px}
.bar .sp{flex:1}
.fleet{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}

<body>
<header><div class="hwrap" id="hdr"></div></header>
<main id="app"><p class="empty">กำลังโหลด…</p></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= ตั้งค่า =================
 * ใส่ URL ของ Web App ที่ได้จาก Google Apps Script (ดู README.md)
 * ถ้าเว้นว่าง ระบบจะทำงานใน "โหมดทดลอง" เก็บข้อมูลในเบราว์เซอร์เครื่องนี้เท่านั้น */
const API_URL = 'https://script.google.com/macros/s/AKfycbxQicoN306gIB_j57PZfPpMMi6cEbIBS8w9GmI74xqT2C4Mq6QT-5E3h8sGTPJn6M7leg/exec';
/* ========================================== */

const DEMO = !API_URL;
const $app = document.getElementById('app');
const S = { data: null, adminPin: null, trips: null, month: null };
const PURPOSES = ['ส่งของ', 'พบลูกค้า', 'ส่งเอกสาร', 'ซื้อของ', 'ซ่อม/บริการ'];

const store = (() => { const mem = {}; return {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
}; })();

// ---------- utils ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => (v === '' || v == null || isNaN(+v)) ? '' : (+v).toLocaleString('en-US', { maximumFractionDigits: 1 });
const fdt = s => s ? new Date(s).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
const ftime = s => s ? new Date(s).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : '';
const flagsOf = t => t.flags ? String(t.flags).split(' | ').filter(Boolean) : [];
const carOf = id => (S.data?.carsAll || S.data?.cars || []).find(c => c.id === id) || { name: id, plate: '' };
const $ = id => document.getElementById(id);
const me = () => store.get('fleet_driver');
function toast(msg, ms = 2800) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms); }
function monthKey(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    try {
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    } catch (e) { res(null); }
  });
}
// ย่อรูป + ประทับเวลา/ทะเบียนรถลงบนรูป
async function readPhoto(file, max, stamp) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0, c.width, c.height);
    if (stamp) {
      const fs = Math.max(12, Math.round(c.width / 32));
      g.font = `600 ${fs}px sans-serif`;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - fs * 1.8, c.width, fs * 1.8);
      g.fillStyle = '#fff'; g.fillText(stamp, fs * 0.5, c.height - fs * 0.6);
    }
    return c.toDataURL('image/jpeg', stamp ? 0.75 : 0.85);
  } finally { URL.revokeObjectURL(url); }
}



// ---------- API ----------
async function call(action, p = {}) {
  if (DEMO) return demo.call(action, Object.assign({}, p, { pin: p.pin ?? store.get('fleet_pin') }));
  const body = Object.assign({}, p, { action, pin: p.pin ?? store.get('fleet_pin') });
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

// ---------- โหมดทดลอง (จำลองหลังบ้านในเบราว์เซอร์) ----------
const DEMO_CFG = {
  cars: [
    { id: 'car1', name: 'Toyota Hilux Revo', plate: 'กข 1234 กรุงเทพมหานคร', fuel: 'diesel', kmPerLiter: 12 },
    { id: 'car2', name: 'Toyota Yaris Ativ', plate: '1กค 5678 กรุงเทพมหานคร', fuel: 'g95', kmPerLiter: 17 },
  ],
  fuel: { source: 'บางจาก', note: 'ราคาตัวอย่าง ณ 19 พ.ย. 69 (ของจริงดึงราคาวันนี้อัตโนมัติ)',
    prices: { diesel: 39.99, b20: 33.5, premium_diesel: 49.05, g95: 38.14, g91: 37.77, e20: 30.1, e85: 30.63, premium_95: 48.55 },
    labels: { diesel: 'ดีเซล', b20: 'ดีเซล B20', premium_diesel: 'ดีเซลพรีเมียม', g95: 'แก๊สโซฮอล์ 95', g91: 'แก๊สโซฮอล์ 91', e20: 'แก๊สโซฮอล์ E20', e85: 'แก๊สโซฮอล์ E85', premium_95: 'เบนซินพรีเมียม 98' } },
  drivers: ['สมชาย', 'สมหญิง', 'สมศักดิ์'],
  pins: { '111111': 'สมชาย', '222222': 'สมหญิง', '333333': 'สมศักดิ์' },
  rules: { workStart: 7, workEnd: 19, workDays: [1, 2, 3, 4, 5], gapKm: 2, extraPct: 30, extraMinKm: 10, maxHours: 10, photoMaxAge: 15, requireReceipt: true,
    gpsRequired: true, gpsGapMin: 10, offrouteKm: 5, company: { lat: 13.668, lng: 100.605 } },
};
function demoApply(st) {
  DEMO_CFG.allCars = st.cars;
  DEMO_CFG.cars = st.cars.filter(c => c.active !== false);
  DEMO_CFG.drivers = st.drivers.filter(x => x.active !== false).map(x => x.name);
  DEMO_CFG.pins = {}; st.drivers.filter(x => x.active !== false).forEach(x => DEMO_CFG.pins[x.pin] = x.name);
  DEMO_CFG.driverList = st.drivers;
}
const demo = {
  load() {
    let d = null;
    try { d = JSON.parse(store.get('fleet_demo') || 'null'); } catch (e) {}
    if (!d) { d = seedData(); this.save(d); }
    d.track = d.track || {};
    if (d.settings) demoApply(d.settings);
    return d;
  },
  save(d) { try { store.set('fleet_demo', JSON.stringify(d)); } catch (e) { toast('พื้นที่เก็บข้อมูลทดลองเต็ม'); } },
  async call(action, p) {
    await new Promise(r => setTimeout(r, 200));
    const d = this.load(), R = DEMO_CFG.rules, now = new Date();
    const outside = x => { const dow = x.getDay() || 7, h = x.getHours(); return !R.workDays.includes(dow) || h < R.workStart || h >= R.workEnd; };
    const lastOdo = car => { let m = null; d.trips.filter(t => t.car === car).forEach(t => { const v = t.endOdo !== '' ? +t.endOdo : +t.startOdo; if (m === null || v > m) m = v; }); return m; };
    const ageFlag = (age, when, f) => { if (+age > R.photoMaxAge) f.push(`รูปเลขไมล์ตอน${when}ไม่ได้ถ่ายตอนนี้ (เป็นรูปที่ถ่ายไว้ ${ageText(age)}ก่อน อาจเลือกรูปเก่าจากอัลบั้ม)`); };

    if (action === 'login') {
      await new Promise(r => setTimeout(r, 300));
      if (p.pin === '9999') return { name: 'ผู้ดูแล', role: 'admin' };
      if (!DEMO_CFG.pins[p.pin]) throw new Error('PIN ไม่ถูกต้อง');
      return { name: DEMO_CFG.pins[p.pin], role: 'driver' };
    }
    if (action === 'setCompany') {
      if (p.pin !== '9999') throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');
      DEMO_CFG.rules.company = { lat: +p.lat, lng: +p.lng, name: p.name || 'บริษัท' };
      return DEMO_CFG.rules.company;
    }
    if (action === 'review') {
      if (p.pin !== '9999') throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');
      const t = d.trips.find(x => x.id === p.tripId); if (!t) throw new Error('ไม่พบรายการนี้');
      Object.assign(t, p.undo ? { reviewStatus: '', reviewNote: '', reviewAt: '' } : { reviewStatus: 'done', reviewNote: String(p.note || '').trim(), reviewAt: now.toISOString() });
      this.save(d); return { id: t.id, reviewStatus: t.reviewStatus, reviewNote: t.reviewNote, reviewAt: t.reviewAt };
    }
    const who = p.pin === '9999' ? 'ผู้ดูแล' : DEMO_CFG.pins[p.pin];
    if (!who && !['trips', 'adminCheck', 'live', 'trackGet'].includes(action)) throw new Error('PIN ไม่ถูกต้อง');
    if (action === 'settingsGet' || action === 'settingsSave') {
      if (p.pin !== '9999') throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');
      if (action === 'settingsSave') {
        if (p.adminPin && p.adminPin !== '9999') throw new Error('โหมดทดลองเปลี่ยน PIN ผู้ดูแลไม่ได้ (ของจริงเปลี่ยนได้)');
        const pins = {}; for (const x of p.drivers) { if (!/^\d{4,8}$/.test(x.pin)) throw new Error(`PIN ของ ${x.name || 'พนักงาน'} ต้องเป็นตัวเลข 4–8 หลัก`); if (!x.name.trim()) throw new Error('กรอกชื่อพนักงานให้ครบ'); if (pins[x.pin]) throw new Error(`PIN ของ ${x.name} ซ้ำกับคนอื่น`); pins[x.pin] = 1; }
        for (const c of p.cars) { if (!c.name.trim() || !c.plate.trim()) throw new Error('กรอกชื่อรุ่นและทะเบียนรถให้ครบทุกคัน'); if (!c.id) c.id = 'car' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
        d.settings = { cars: p.cars, drivers: p.drivers }; demoApply(d.settings); this.save(d);
      }
      return { cars: DEMO_CFG.allCars || DEMO_CFG.cars.map(c => ({ ...c, active: true })),
        drivers: DEMO_CFG.driverList || Object.entries(DEMO_CFG.pins).map(([pin, name]) => ({ name, pin, active: true })),
        adminDefault: true, company: R.company, fuelTypes: Object.entries(DEMO_CFG.fuel.labels).map(([id, label]) => ({ id, label })) };
    }
    if (action === 'myTrips') return d.trips.filter(t => t.driver === who).slice().reverse();
    if (action === 'init') return {
      carsAll: DEMO_CFG.allCars || DEMO_CFG.cars, adminDefault: true,
      drivers: DEMO_CFG.drivers, rules: R, fuel: DEMO_CFG.fuel,
      cars: DEMO_CFG.cars.map(c => Object.assign({}, c, { open: d.trips.find(t => t.car === c.id && t.status === 'open') || null, lastOdo: lastOdo(c.id) })),
    };
    if (action === 'adminCheck' || action === 'trips') {
      if (p.pin !== '9999') throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');
      return action === 'trips' ? d.trips.slice().reverse() : true;
    }
    if (action === 'route') return demoRoute(p.stops);
    if (action === 'place') return demoPlace(p.q);
    if (action === 'receipt') { // โหมดทดลอง: แกล้งอ่านใบเสร็จ ของจริงใช้ OCR ของ Google Drive
      await new Promise(r => setTimeout(r, 900));
      const price = DEMO_CFG.fuel.prices.diesel, liters = 30.12;
      return { liters, price, baht: Math.round(liters * price * 100) / 100, date: new Date().toISOString().slice(0, 10), found: true, sure: true, demo: true };
    }
    if (action === 'track') {
      const t = d.trips.find(x => x.id === p.tripId); if (!t) throw new Error('ไม่พบรายการใช้รถนี้');
      (d.track[t.id] = d.track[t.id] || []).push(...(p.points || [])); this.save(d); return { saved: (p.points || []).length };
    }
    if (action === 'live') {
      if (p.pin !== '9999') throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');
      const trips = d.trips.filter(t => t.status === 'open').map(t => {
        const car = DEMO_CFG.cars.find(c => c.id === t.car); let stops = []; try { stops = JSON.parse(t.stopsJson || '[]'); } catch (e) {}
        return { id: t.id, car: t.car, carName: car.name, plate: car.plate, driver: t.driver, purpose: t.purpose, startTime: t.startTime, routePoly: t.routePoly || '',
          startOdo: t.startOdo, expectedKm: t.expectedKm, stops, points: (d.track[t.id] || []).map(q => [q.t, q.lat, q.lng]) };
      });
      const v = demoVirtual(d); if (v) trips.push(v);
      return { trips, company: R.company, now: Date.now() };
    }
    if (action === 'trackGet') {
      if (p.pin !== '9999') throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');
      const t = d.trips.find(x => x.id === p.tripId);
      let stops = []; try { stops = JSON.parse(t?.stopsJson || '[]'); } catch (e) {}
      return { points: d.track[p.tripId] || [], stops, company: R.company, routePoly: t?.routePoly || '' };
    }
    if (action === 'checkout') {
      const odo = +p.odo;
      if (!(odo > 0)) throw new Error('กรุณากรอกเลขไมล์');
      if (!p.photo) throw new Error('กรุณาถ่ายรูปหน้าปัดเลขไมล์');
      if (!String(p.purpose || '').trim()) throw new Error('กรุณาระบุวัตถุประสงค์');
      if (d.trips.some(t => t.car === p.car && t.status === 'open')) throw new Error('รถคันนี้ยังไม่ได้คืน');
      const flags = [], last = lastOdo(p.car);
      if (last !== null) {
        if (odo < last) flags.push(`เลขไมล์ต่ำกว่าตอนคืนรถครั้งก่อน (${n(last)})`);
        else if (odo - last > R.gapKm) flags.push(`มี ${n(odo - last)} กม. ที่ไม่ได้บันทึก (คืนรถครั้งก่อนที่ ${n(last)})`);
      }
      if (outside(now)) flags.push('นำรถออกนอกเวลางาน');
      ageFlag(p.photoAgeMin, 'รับรถ', flags);
      let expKm = '', rpoly = ''; try { const rr = demoRoute(p.stops || p.destination); expKm = rr.totalKm; rpoly = rr.poly; } catch (e) {}
      const t = { id: Math.random().toString(36).slice(2, 10), status: 'open', car: p.car, driver: who === 'ผู้ดูแล' ? p.driver : who, purpose: p.purpose.trim(),
        destination: (p.destination || '').trim(), startTime: now.toISOString(), startOdo: odo, startPhoto: p.photo,
        startLat: p.lat ?? '', startLng: p.lng ?? '', expectedKm: expKm, endTime: '', endOdo: '', endPhoto: '', endLat: '', endLng: '',
        distance: '', fuelLiters: '', fuelBaht: '', note: '', flags: flags.join(' | '), stopsJson: JSON.stringify(p.stops || []), routePoly: rpoly };
      d.trips.push(t); this.save(d);
      return { id: t.id, flags, expectedKm: expKm };
    }
    if (action === 'checkin') {
      const t = d.trips.find(x => x.id === p.tripId && x.status === 'open');
      if (!t) throw new Error('ไม่พบรายการที่ยังไม่คืน');
      const odo = +p.odo;
      if (!(odo > 0)) throw new Error('กรุณากรอกเลขไมล์');
      if (odo < +t.startOdo) throw new Error(`เลขไมล์ต้องไม่น้อยกว่าตอนรับรถ (${n(t.startOdo)})`);
      if (!p.photo) throw new Error('กรุณาถ่ายรูปหน้าปัดเลขไมล์');
      const dist = odo - +t.startOdo, flags = flagsOf(t), exp = +t.expectedKm, start = new Date(t.startTime);
      if (exp > 0 && dist > exp * (1 + R.extraPct / 100) && dist - exp >= R.extraMinKm) flags.push(`วิ่งจริง ${n(dist)} กม. แต่ Google Maps คำนวณไว้ ~${exp} กม. (เกิน ${n(dist - exp)} กม.) · เลขไมล์ควรจบที่ ~${n(+t.startOdo + exp)}`);
      if (start.toDateString() !== now.toDateString()) flags.push('ไม่คืนรถภายในวันเดียวกัน');
      else if ((now - start) / 36e5 > R.maxHours) flags.push(`ใช้รถนาน ${((now - start) / 36e5).toFixed(1)} ชม.`);
      if (outside(now)) flags.push('คืนรถนอกเวลางาน');
      ageFlag(p.photoAgeMin, 'คืนรถ', flags);
      const car = DEMO_CFG.cars.find(c => c.id === t.car), fp = DEMO_CFG.fuel;
      const fuelType = fp.prices[p.fuelType] ? p.fuelType : car.fuel, price = fp.prices[fuelType] || '';
      const L = +p.fuelLiters || 0, baht = +p.fuelBaht || 0;
      if (L > 0 && !p.receipt) throw new Error('กรุณาถ่ายรูปใบเสร็จน้ำมัน');
      if (p.receipt) t.receiptPhoto = p.receipt;
      if (price && L > 0 && baht > 0) {
        const should = L * price, diff = (baht - should) / should * 100;
        if (Math.abs(diff) > 5) flags.push(`ยอดเติมน้ำมัน ${n(baht)} บาท ไม่ตรงกับ ${L} ลิตร × ${price} บาท = ${n(Math.round(should))} บาท (ต่าง ${diff > 0 ? '+' : ''}${diff.toFixed(0)}%)`);

function odo(v, cls = '', digits = 6) {

}

async function boot() {
  $app.classList.remove('wide');
  if (!store.get('fleet_pin') || !me()) return renderLogin();
  if (isAdmin()) return adminGo(S.tab && S.tab !== 'live' ? S.tab : 'overview');
  header('Mks Gps');
  try {
    S.data = await call('init');
  } catch (e) {
    if (/PIN/.test(e.message)) { logout(); return renderLogin('PIN นี้ใช้ไม่ได้แล้ว กรุณาเข้าใช้งานใหม่'); }
    $app.innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}<br><br><button class="btn sm" onclick="boot()">ลองใหม่</button></div>`;
    return;
  }
  const q = new URLSearchParams(location.search).get('car');
  if (q && S.data.cars.some(c => c.id === q)) {
    history.replaceState(null, '', location.pathname);
    return openCar(q);
  }
  renderHome();
}

function renderLogin(err) {
  header('Mks Gps');
  let pin = '';
  $app.innerHTML = `<div class="login">
    <img class="applogo" src="${LOGO}" alt="เมืองเกษตร GPS Tracking" width="720" height="394">
    <h2 class="title">เข้าใช้งาน</h2><p class="lead">พนักงานกรอก PIN ของตัวเอง ผู้ดูแลกรอก PIN ผู้ดูแล</p>
    <div class="pdots" id="pdots" aria-live="polite"></div>
    <p class="note warn" id="perr">${err ? esc(err) : ''}</p>
    <button class="btn sm line" id="pok" disabled style="margin:0 auto 6px;display:block">เข้าใช้งาน</button>
    <div class="keypad" id="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, 'del'].map(k => k === '' ? '<span></span>'
      : `<button type="button" data-k="${k}" aria-label="${k === 'del' ? 'ลบ' : k}">${k === 'del' ? '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m16 9-5 6M11 9l5 6"/></svg>' : k}</button>`).join('')}</div>
    ${DEMO ? '<p class="demo" style="margin-top:20px">โหมดทดลอง: คนขับ สมชาย 111111, สมหญิง 222222, สมศักดิ์ 333333<br>ผู้ดูแล 9999 แล้วกดเข้าใช้งาน</p>' : ''}</div>`;
  const draw = () => { $('pdots').innerHTML = Array.from({ length: 6 }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); };
  const submit = async () => {
    $('perr').textContent = 'กำลังตรวจสอบ…'; $('perr').className = 'note';
    try {
      const r = await call('login', { pin });
      store.set('fleet_pin', pin); store.set('fleet_driver', r.name); store.set('fleet_role', r.role || 'driver');
      boot();
    } catch (e) {
      $('perr').className = 'note warn'; $('perr').textContent = e.message;
      $('pdots').classList.add('shake'); setTimeout(() => $('pdots') && $('pdots').classList.remove('shake'), 400);
      pin = ''; draw();
    }
  };
  const press = k => {
    if (k === 'del') pin = pin.slice(0, -1);
    else if (pin.length < 6) pin += k;
    draw();
    $('pok').disabled = pin.length < 4;
    if (pin.length === 6) submit();
  };
  $('keypad').onclick = e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
  $('pok').onclick = () => { if (pin.length >= 4) submit(); };
  document.onkeydown = e => { if (!$('keypad')) { document.onkeydown = null; return; } if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); else if (e.key === 'Enter' && pin.length >= 4) submit(); };
  draw();
}

// ---------- หน้าแรก ----------
function renderHome() {
  header('Mks Gps', null, `<button class="hlink" id="who" aria-label="เมนู">${esc(me())} ▾</button>`);
  $('who').onclick = driverMenu;
  const cars = S.data.cars.slice().sort((a, b) => (b.open?.driver === me()) - (a.open?.driver === me()));
  const using = cars.find(c => c.open?.driver === me());
  $app.innerHTML = `${DEMO ? `<div class="demo">โหมดทดลอง ข้อมูลเก็บในเครื่องนี้เท่านั้น อยากลองฝั่งผู้ดูแล ให้ออกจากระบบแล้วกรอก PIN 9999 <a href="#" id="reset">ล้างข้อมูลทดลอง</a></div>` : ''}
    <h2 class="title">สวัสดี ${esc(me())}</h2>
    <p class="lead">${using ? `คุณกำลังใช้ ${esc(using.name)} อยู่ กลับถึงบริษัทแล้วกดคืนรถด้วยนะครับ` : 'วันนี้จะใช้รถคันไหน'}</p>
    <div class="cars">${cars.map(c => {
      const o = c.open, mine = o && o.driver === me();
      const st = !o ? '<span class="status free">ว่าง</span>' : mine ? '<span class="status mine">คุณใช้อยู่</span>' : '<span class="status busy">ไม่ว่าง</span>';
      const exp = o && +o.expectedKm > 0 ? +o.startOdo + +o.expectedKm : null;
      return `<article class="car ${mine ? 'mine' : ''}">
        <div class="car-top">${plate(c.plate)}${st}</div>
        <h2>${esc(c.name)}</h2>
        ${o && !mine ? `<p class="who">${esc(o.driver)} ออกไปตั้งแต่ ${ftime(o.startTime)}</p>` : ''}
        ${mine ? `<p class="who">ออกไป${esc(o.purpose)} ตั้งแต่ ${ftime(o.startTime)}</p>` : ''}
        <div class="row"><span class="small">${o ? (exp ? 'ควรกลับมาที่' : 'ออกไปที่') : 'เลขไมล์ล่าสุด'}</span>${odo(o ? (exp || o.startOdo) : c.lastOdo, 'sm' + (exp ? ' hl' : ''))}</div>
        ${mine ? `${trActive(o.id) ? '<div class="gpsrow"><span class="pulse"></span>กำลังบันทึกเส้นทาง GPS</div>' : ''}
          <button class="btn soft" data-drive="${esc(c.id)}" style="margin-bottom:10px">${trActive(o.id) ? 'กลับไปหน้ากำลังขับ' : trHas(o.id) ? 'บันทึกเส้นทางต่อ' : 'เริ่มบันทึกเส้นทาง GPS'}</button>` : ''}
        <button class="btn ${o && !mine ? 'line' : ''}" data-car="${esc(c.id)}">${!o ? 'รับรถ' : mine ? 'คืนรถ' : 'คืนรถแทน'}</button>
      </article>`;
    }).join('')}</div>`;
  $app.querySelectorAll('[data-car]').forEach(b => b.onclick = () => openCar(b.dataset.car));
  $app.querySelectorAll('[data-drive]').forEach(b => b.onclick = () => openDrive(b.dataset.drive));
  if ($('reset')) $('reset').onclick = e => { e.preventDefault(); ask('ล้างข้อมูลทดลองทั้งหมด?', 'ล้างข้อมูล', () => { store.del('fleet_demo'); boot(); }); };
  window.scrollTo(0, 0);
}

function openCar(id) {
  const c = S.data.cars.find(x => x.id === id);
  if (c.open && c.open.driver !== me()) return ask(`${c.open.driver} กำลังใช้รถคันนี้อยู่ จะคืนรถแทนใช่ไหม`, 'คืนรถแทน', () => renderCheckin(c));
  c.open ? renderCheckin(c) : renderCheckout(c);
}

// ---------- ถ่ายรูป ----------
function photoStep() {
  return `<label class="shot" id="shot"><span id="ph0" style="display:contents">${ICON.cam}ถ่ายรูปหน้าปัดเลขไมล์</span>
      <img id="prevImg" alt="รูปเลขไมล์" style="display:none"><input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
    <p class="note" id="retake" style="display:none">แตะที่รูปเพื่อถ่ายใหม่</p>`;
}
function bindPhoto(car, P, stepId) {
  $('photo').onchange = async () => {
    const f = $('photo').files[0];
    if (!f) return;
    P.photoAgeMin = f.lastModified ? Math.max(0, (Date.now() - f.lastModified) / 60000) : '';
    try {
      P.photo = await readPhoto(f, DEMO ? 480 : 1280, `${car.plate}  ${new Date().toLocaleString('th-TH')}`);
      $('prevImg').src = P.photo; $('prevImg').style.display = 'block';
      $('ph0').style.display = 'none'; $('shot').classList.add('has');
      $('retake').style.display = 'block'; $(stepId).classList.add('done');
    } catch (e) { toast('เปิดรูปไม่ได้ ลองถ่ายใหม่อีกครั้ง'); }

  const C = S.data.rules.company;

  const path = [C, ...stops.map(x => ({ lat: +x.lat, lng: +x.lng })), C];

    const d = kmBetween(pos, target), step = 0.7;

/** สถานะของเที่ยว: ผ่านจุดไหนแล้ว กำลังไปไหน ออกนอกเส้นทางไหม (pts = [{t,lat,lng}]) */
function tripState(pts, stops, company, R, road) {
  const visited = stops.map(s => pts.some(p => kmBetween(p, s) < 0.35));
  const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
  let km = 0; for (let i = 1; i < pts.length; i++) { const d = kmBetween(pts[i - 1], pts[i]); if (d >= 0.02) km += d; }
  const st = { visited, last, km, next: visited.indexOf(false), at: -1, off: 0, speed: null, deg: null, stale: 0 };
  if (!last) return st;
  st.at = stops.findIndex(s => kmBetween(last, s) < 0.35);
  if (prev && last.t && prev.t && last.t - prev.t < 5 * 60000) {
    const d = kmBetween(prev, last); st.speed = d / Math.max((last.t - prev.t) / 36e5, 1e-6); if (d > 0.02) st.deg = bearing(prev, last);
  }
  if (company && stops.length) {
    const path = road && road.length > 1 ? road : [company, ...stops, company]; let b = Infinity;
    for (let i = 1; i < path.length; i++) b = Math.min(b, segDistKm(last, path[i - 1], path[i]));
    st.off = b > R.offrouteKm ? b : 0;
  }
  st.stale = last.t ? Date.now() - last.t : 0;
  return st;
}
function stateText(st, stops) {
  if (!st.last) return { cls: 'wait', text: 'รอสัญญาณ GPS จากมือถือคนขับ' };
  if (st.stale > 3 * 60000) return { cls: 'stale', text: `ไม่ได้รับตำแหน่ง ${agoText(st.stale).replace('ที่แล้ว', '')} แล้ว` };
  if (st.off) return { cls: 'off', text: `ออกนอกเส้นทาง ห่าง ${st.off.toFixed(1)} กม.` };
  if (st.at >= 0) return { cls: 'ok', text: `อยู่ที่จุดที่ ${st.at + 1} ${stops[st.at].name || ''}` };
  if (st.next >= 0) return { cls: 'ok', text: `กำลังไปจุดที่ ${st.next + 1} ${stops[st.next].name || ''}` };
  return { cls: 'ok', text: 'กำลังกลับบริษัท' };
}
function stepper(stops, st) {
  const dots = [['บริษัท', true], ...stops.map((s, i) => [String(i + 1), st.visited[i]]), ['กลับ', false]];
  const cur = st.next >= 0 ? st.next + 1 : stops.length + 1;
  return `<div class="stepr">${dots.map(([l, done], i) => `${i ? `<span class="sl ${i <= cur && (done || i === cur) ? 'on' : ''}"></span>` : ''}<span class="sd ${done ? 'done' : ''} ${i === cur ? 'cur' : ''}">${l}</span>`).join('')}</div>`;
}
function drawTripLayers(layer, trip, pts, stops, company, st, selected) {
  layer.clearLayers();

  const ln = trip.snap && trip.snap.length > 1 ? trip.snap : pts.map(p => [p.lat, p.lng]); // ตามถนนถ้ามี
  if (ln.length > 1) {
    L.polyline(ln, { color: '#ffffff', weight: selected ? 9 : 6, opacity: .9 }).addTo(layer);
    L.polyline(ln, { color: st.off ? '#D97706' : '#E11D2E', weight: selected ? 5 : 3, opacity: selected ? 1 : .55 }).addTo(layer);
  }
  if (selected) stops.forEach((s, i) => L.marker([s.lat, s.lng], { icon: stopIcon(i + 1, st.visited[i]), zIndexOffset: 100 }).bindTooltip(esc(s.name || ''), { direction: 'top' }).addTo(layer));
  if (st.last) {
    const state = st.stale > 3 * 60000 ? 'stale' : st.off ? 'off' : 'ok';
    L.marker([st.last.lat, st.last.lng], { icon: carIcon(selected ? '' : trip.plate.split(' ').slice(0, 2).join(' '), state, st.deg), zIndexOffset: 1000 })
      .on('click', () => { MAPS.sel = trip.id; MAPS.userMoved = true; liveDraw(); }).addTo(layer);
  }
}

  if (TR.wakeOk === false) warn.push('มือถือนี้สั่งกันจอดับไม่ได้ ตั้งเวลาปิดหน้าจออัตโนมัติให้นานขึ้นก่อนออกรถ');
  $('dWarn').innerHTML = warn.length ? `<div class="verdict warn" style="margin-bottom:10px">${warn.map(esc).join('<br>')}</div>` : '';
  if ($('dDot')) $('dDot').className = 'pulse' + (TR.on && !S0.err ? '' : ' off');
  if ($('dStatus')) $('dStatus').textContent = TR.on ? (S0.n ? 'กำลังบันทึกเส้นทาง' : 'กำลังหาสัญญาณ GPS…') : 'หยุดบันทึกแล้ว';
}

// เปิดเส้นทางเดียวกันใน Google Maps ไว้เทียบ: บริษัท → จุดแวะ → บริษัท
const hqName = () => (S.data?.rules?.company?.name && S.data.rules.company.name !== 'บริษัท') ? S.data.rules.company.name : 'บริษัท';
function gmapsLink(stops) {
  const C = S.data?.rules?.company; if (!C || !stops || !stops.length) return '';
  const ll = p => `${(+p.lat).toFixed(6)},${(+p.lng).toFixed(6)}`;
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + ll(C) + '&destination=' + ll(C)
    + '&waypoints=' + encodeURIComponent(stops.map(ll).join('|'));
}

// ---------- ราคาน้ำมัน ----------
const fuelPrice = k => S.data?.fuel?.prices?.[k] || 0;
const fuelLabel = k => S.data?.fuel?.labels?.[k] || k || '';
const tripCost = (c, km) => fuelPrice(c.fuel) && c.kmPerLiter ? Math.round(km / c.kmPerLiter * fuelPrice(c.fuel)) : 0;

// ---------- รับรถ ----------
function renderCheckout(c) {
  const R = S.data.rules, P = { purpose: '' }, pos = getPos();
  header('รับรถ', renderHome);
  $app.innerHTML = `${carCtx(c)}
    <ol class="steps">
      <li class="st" id="s1"><span class="dot">1</span><h3>ถ่ายรูปหน้าปัด</h3>${photoStep()}</li>
      <li class="st" id="s2"><span class="dot">2</span><h3>เลขไมล์ตอนนี้</h3>${odoInput('odo')}
        <p class="note" id="odoHint">${c.lastOdo != null ? 'คืนรถครั้งก่อนที่ ' + n(c.lastOdo) + ' กม.' : 'แตะที่ตัวเลขเพื่อพิมพ์'}</p></li>
      <li class="st" id="s3"><span class="dot">3</span><h3>ไปทำอะไร</h3>
        <div class="chips" id="chips">${PURPOSES.map(p => `<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join('')}<button class="chip" data-p="">อื่น ๆ</button></div>
        <input id="other" class="f mt" placeholder="พิมพ์งานที่ไปทำ" style="display:none"></li>
      <li class="st" id="s4"><span class="dot">4</span><h3>จะไปที่ไหนบ้าง<small>เรียงตามลำดับ</small></h3>
        <div id="stops"></div>
        <button class="add" id="addStop" type="button">+ เพิ่มจุดแวะ</button>
        <div id="routeBox"></div></li>
    </ol>
    <div class="dock"><button class="btn" id="submit">ยืนยันรับรถ</button></div>`;
  bindPhoto(c, P, 's1');

  // จุดแวะหลายจุด: ค้นหาจาก Google Maps แล้วแตะเลือก
  P.stops = [{ q: '' }];
  const picked = () => P.stops.filter(x => x.pick).map(x => x.pick);
  const allPicked = () => P.stops.length > 0 && P.stops.every(x => x.pick);
  const clearRoute = () => { P.route = null; $('routeBox').innerHTML = ''; $('s4').classList.remove('done'); };
  const drawStops = () => {
    $('stops').innerHTML = P.stops.map((x, i) => x.pick
      ? `<div class="pick"><span class="n">${i + 1}</span><div class="pk"><b>${esc(x.pick.name)}</b><span>${esc(x.pick.address || '')}</span></div>
          <button class="rm" type="button" data-rm="${i}" aria-label="เปลี่ยนสถานที่ที่ ${i + 1}">×</button></div>`
      : `<div class="stop"><span class="n">${i + 1}</span>
          <input class="f" data-i="${i}" value="${esc(x.q)}" placeholder="${i ? 'จุดแวะถัดไป' : 'พิมพ์ชื่อสถานที่ เช่น โฮมโปร บางนา'}" aria-label="สถานที่ที่ ${i + 1}" enterkeyhint="search">
          <button class="btn sm" type="button" data-find="${i}">${x.busy ? '…' : 'ค้นหา'}</button></div>
        ${x.results ? `<div class="res">${x.results.length
          ? x.results.map((r, j) => `<button type="button" data-pick="${i}:${j}"><b>${esc(r.name)}</b><span>${esc(r.address || '')}</span></button>`).join('')
          : '<div class="msg">ไม่พบใน Google Maps ลองพิมพ์ชื่ออื่น หรือวางลิงก์ที่แชร์จากแอป Google Maps</div>'}</div>` : ''}
        ${i === 0 && !x.results ? '<p class="tip">หาไม่เจอ? เปิดแอป Google Maps กดแชร์สถานที่ แล้ววางลิงก์ในช่องนี้ได้</p>' : ''}`).join('');
    $('addStop').style.display = P.stops.length >= 8 ? 'none' : 'block';
    $('stops').querySelectorAll('input[data-i]').forEach(inp => {
      inp.oninput = () => { P.stops[+inp.dataset.i].q = inp.value; };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); find(+inp.dataset.i); } };
    });
  };
  const find = async i => {
    const x = P.stops[i];
    if (!x.q.trim()) return toast('พิมพ์ชื่อสถานที่ก่อน');
    x.busy = true; drawStops();
    try { x.results = await call('place', { q: x.q }); }
    catch (e) { x.results = null; toast(e.message, 5000); }
    x.busy = false; drawStops();
    if (x.results && x.results.length === 1 && /^https?:/.test(x.q)) choose(i, 0); // ลิงก์ได้ผลเดียว เลือกให้เลย
  };
  const choose = (i, j) => {
    P.stops[i].pick = P.stops[i].results[j]; P.stops[i].results = null;
    drawStops(); clearRoute();
    if (allPicked()) calc();
  };
  $('stops').onclick = e => {
    const f = e.target.closest('[data-find]'), pk = e.target.closest('[data-pick]'), rm = e.target.closest('[data-rm]');
    if (f) find(+f.dataset.find);
    if (pk) { const [i, j] = pk.dataset.pick.split(':').map(Number); choose(i, j); }
    if (rm) {
      const i = +rm.dataset.rm;
      if (P.stops.length > 1) P.stops.splice(i, 1); else P.stops[i] = { q: '' };
      drawStops(); clearRoute(); if (allPicked()) calc();
    }
  };
  drawStops();
  $('addStop').onclick = () => {
    P.stops.push({ q: '' }); drawStops(); clearRoute();
    const ins = $app.querySelectorAll('.stop input'); if (ins.length) ins[ins.length - 1].focus();
  };

  const drawRoute = () => {
    const r = P.route; if (!r) return;
    const start = +$('odo').value;
    const legs = r.legs;
    $('routeBox').innerHTML = `<div class="route"><ul class="rt">
      <li class="hq"><span class="nm">${esc(hqName())}</span><div class="ad">จุดเริ่มต้น</div></li>
      ${legs.map((l, i) => `<div class="leg">${n(l.km)} กม.</div>
        ${i < legs.length - 1 ? `<li><span class="nm">${i + 1}. ${esc(l.to)}</span>${l.address ? `<div class="ad">${esc(l.address)}</div>` : ''}</li>` : '<li class="hq"><span class="nm">กลับบริษัท</span></li>'}`).join('')}
      </ul>
      <div class="sum"><span>รวมไป-กลับ<br><span class="small">ขับประมาณ ${Math.floor(r.totalMin / 60) ? Math.floor(r.totalMin / 60) + ' ชม. ' : ''}${r.totalMin % 60} นาที</span></span><b>${n(r.totalKm)} กม.</b></div>
      ${tripCost(c, r.totalKm) ? `<div class="cost">ค่าน้ำมันโดยประมาณ <b>${n(tripCost(c, r.totalKm))} บาท</b> (${c.kmPerLiter} กม./ลิตร × ราคา${fuelLabel(c.fuel)}วันนี้ ${fuelPrice(c.fuel)} บาท)</div>` : ''}
      <div class="expect">${start ? `<p>กลับถึงบริษัท เลขไมล์ควรอยู่ที่ประมาณ</p>${odo(start + r.totalKm, 'lg hl')}` : '<p>กรอกเลขไมล์ในข้อ 2 แล้วจะเห็นว่าตอนกลับควรเป็นเลขเท่าไหร่</p>'}</div>
      ${gmapsLink(picked()) ? `<a class="gmlink" href="${gmapsLink(picked())}" target="_blank" rel="noopener">ตรวจเส้นทางนี้ใน Google Maps ↗</a>` : ''}
      ${r.demo ? '<p class="fake">โหมดทดลองใช้ระยะทางสมมติ ของจริงคำนวณจาก Google Maps</p>' : ''}</div>`;
  };
  const calc = async () => {
    if (!allPicked()) { toast('เลือกสถานที่จาก Google Maps ให้ครบทุกจุดก่อน'); return false; }
    $('routeBox').innerHTML = '<p class="note">กำลังคำนวณระยะทางจาก Google Maps…</p>';
    try { P.route = await call('route', { stops: picked() }); drawRoute(); $('s4').classList.add('done'); return true; }
    catch (e) { $('routeBox').innerHTML = ''; toast(e.message, 5000); return false; }
  };

  bindOdoInput('odo', v => {
    const h = $('odoHint');
    $('s2').classList.toggle('done', v > 0);
    drawRoute();
    if (c.lastOdo == null || !v) { h.className = 'note'; h.textContent = c.lastOdo != null ? 'คืนรถครั้งก่อนที่ ' + n(c.lastOdo) + ' กม.' : ''; return; }
    const g = v - c.lastOdo;
    if (g < 0) { h.className = 'note warn'; h.textContent = `น้อยกว่าตอนคืนรถครั้งก่อน (${n(c.lastOdo)}) ตรวจตัวเลขอีกครั้ง`; }
    else if (g > R.gapKm) { h.className = 'note warn'; h.textContent = `มากกว่าตอนคืนรถครั้งก่อน ${n(g)} กม. ระบบจะแจ้งผู้ดูแล`; }
    else { h.className = 'note ok'; h.textContent = 'ตรงกับตอนคืนรถครั้งก่อน'; }
  });
  $('chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    $('chips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    P.other = b.dataset.p === '';
    P.purpose = b.dataset.p;
    $('other').style.display = P.other ? 'block' : 'none';
    if (P.other) $('other').focus();
    $('s3').classList.add('done');
  };
  $('submit').onclick = async () => {
    const odoV = $('odo').value, purpose = P.other ? $('other').value.trim() : P.purpose;
    if (!P.photo) return toast('ถ่ายรูปหน้าปัดก่อนนะครับ');
    if (!odoV) return toast('กรอกเลขไมล์ก่อนนะครับ');
    if (!purpose) return toast('เลือกว่าไปทำอะไรก่อนนะครับ');
    if (!allPicked()) { $('s4').scrollIntoView({ behavior: 'smooth' }); return toast('ค้นหาและเลือกสถานที่จาก Google Maps ให้ครบทุกจุด'); }
    if (!P.route && !(await calc())) return;
    const stops = picked();
    const b = $('submit'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try {
      const p = await pos;
      const r = await call('checkout', { car: c.id, driver: me(), odo: +odoV, purpose, destination: stops.map(x => x.name).join('\n'), stops,
        photo: P.photo, photoAgeMin: P.photoAgeMin, lat: p?.lat, lng: p?.lng });
      renderDone('รับรถแล้ว', `<p>${esc(c.name)} ออกที่เลขไมล์ ${n(odoV)} กม.</p>
        ${r.expectedKm ? `<div class="expect"><p>ไป-กลับ ${n(r.expectedKm)} กม. กลับถึงบริษัทเลขไมล์ควรอยู่ที่ประมาณ</p>${odo(+odoV + +r.expectedKm, 'lg hl')}</div>` : ''}
        <p class="small mt">กดเริ่มขับเพื่อบันทึกเส้นทาง GPS แล้ววางมือถือเปิดหน้าจอค้างไว้ในรถ</p>`, r.flags,
        { label: 'เริ่มขับ บันทึกเส้นทาง', fn: async () => { S.data = await call('init'); openDrive(c.id); } });
    } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'ยืนยันรับรถ'; }
  };
  window.scrollTo(0, 0);
}

// ---------- คืนรถ ----------
function renderCheckin(c) {
  const t = c.open, R = S.data.rules, P = {}, pos = getPos(), exp = +t.expectedKm;
  const stops = t.destination ? String(t.destination).split('\n') : [];
  header('คืนรถ', renderHome);
  $app.innerHTML = `${carCtx(c)}
    ${trHas(t.id) ? `<div class="gpsrow"><span class="pulse ${trActive(t.id) ? '' : 'off'}"></span>GPS บันทึกไว้ ${TR.st.km.toFixed(1)} กม. จะส่งพร้อมการคืนรถ</div>` : ''}
    <div class="plan"><b>${esc(t.driver)}</b> ออกไป${esc(t.purpose)} ตั้งแต่ ${ftime(t.startTime)}
      ${stops.length ? `<ol>${stops.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}</div>
    <div class="compare">
      <div><p>ออกไปที่</p>${odo(t.startOdo, 'sm')}</div>
      <div><p>ควรกลับมาที่</p>${exp > 0 ? odo(+t.startOdo + exp, 'sm hl') : '<b>–</b>'}</div></div>
    <ol class="steps">
      <li class="st" id="s1"><span class="dot">1</span><h3>ถ่ายรูปหน้าปัด</h3>${photoStep()}</li>
      <li class="st" id="s2"><span class="dot">2</span><h3>เลขไมล์ตอนนี้</h3>${odoInput('odo')}<div id="result"></div></li>
      <li class="st" id="s3"><span class="dot">3</span><h3>เติมน้ำมันไหม</h3>
        <div class="chips" id="fuelChips"><button class="chip on" data-f="0">ไม่ได้เติม</button><button class="chip" data-f="1">เติมน้ำมัน</button></div>
        <div id="fuel" style="display:none">
          <label class="shot rshot" id="rshot"><span id="rph0" style="display:contents">${ICON.cam}ถ่ายรูปใบเสร็จน้ำมัน<span class="small">ระบบจะอ่านลิตรและยอดเงินให้</span></span>
            <img id="rImg" alt="ใบเสร็จน้ำมัน" style="display:none"><input id="receipt" type="file" accept="image/*" capture="environment" hidden></label>
          <div class="rstat" id="rstat"></div>
          ${S.data.fuel ? `<div class="price"><select id="ftype" aria-label="ชนิดน้ำมัน">${Object.keys(S.data.fuel.prices).map(k => `<option value="${k}" ${k === c.fuel ? 'selected' : ''}>${esc(fuelLabel(k))}</option>`).join('')}</select>
            <b id="pnow"></b></div><p class="small" style="margin:6px 2px 0">ราคาน้ำมัน${esc(S.data.fuel.source)}วันนี้ ${esc(S.data.fuel.note)}</p>`
            : '<p class="small">ดึงราคาน้ำมันวันนี้ไม่ได้ กรอกตามใบเสร็จได้เลย</p>'}
          <div class="two mt">
            <div><div class="lbl">กี่ลิตร</div><input id="fl" class="f" type="number" inputmode="decimal" step="0.01"><div class="auto" id="flA"></div></div>
            <div><div class="lbl">กี่บาท</div><input id="fb" class="f" type="number" inputmode="decimal" step="0.01"><div class="auto" id="fbA"></div></div></div>
          <div id="fuelCheck"></div></div>
        <textarea id="note" class="f mt" placeholder="หมายเหตุ (ถ้ามี) เช่น รถติด แวะเพิ่ม"></textarea></li>
    </ol>
    <div class="dock"><button class="btn" id="submit">ยืนยันคืนรถ</button></div>`;
  bindPhoto(c, P, 's1');
  $('s3').classList.add('done');
  bindOdoInput('odo', v => {
    const d = v - t.startOdo, el = $('result');
    $('s2').classList.toggle('done', v >= t.startOdo && v > 0);
    if (!v) { el.innerHTML = ''; return; }
    if (d < 0) { el.innerHTML = `<p class="note warn">ต้องไม่น้อยกว่าตอนออก (${n(t.startOdo)})</p>`; return; }
    const over = exp > 0 && d > exp * (1 + R.extraPct / 100) && d - exp >= R.extraMinKm;
    el.innerHTML = `<div class="result"><span class="small">รอบนี้วิ่งจริง</span><div class="km">${n(d)} กม.</div>
      ${exp > 0 ? `<div class="verdict ${over ? 'warn' : 'ok'}">${d > exp ? `มากกว่าที่ Google Maps คำนวณไว้ ${n(d - exp)} กม.` : `ไม่เกินที่ Google Maps คำนวณไว้ (${n(exp)} กม.)`}${over ? '<br>ช่วยเขียนเหตุผลในหมายเหตุด้วยนะครับ' : ''}</div>` : ''}
      ${tripCost(c, d) ? `<div class="cost">ค่าน้ำมันเที่ยวนี้ประมาณ <b>${n(tripCost(c, d))} บาท</b></div>` : ''}</div>`;
  });
  // เติมน้ำมัน: กรอกลิตรหรือบาทช่องเดียว อีกช่องคำนวณจากราคาจริงวันนี้ให้ ถ้ากรอกเองทั้งสองช่อง จะตรวจว่าตรงกับราคาไหม
  const F = { man: { fl: false, fb: false } };
  const curType = () => $('ftype') ? $('ftype').value : c.fuel;
  const price = () => fuelPrice(curType());
  const fuelCheck = () => {
    const p = price(), L = +$('fl').value, B = +$('fb').value, box = $('fuelCheck');
    if ($('pnow')) $('pnow').innerHTML = p ? `${p.toFixed(2)} <small>บาท/ลิตร</small>` : '–';
    if (!p || !L || !B || !(F.man.fl && F.man.fb)) { box.innerHTML = ''; return; }
    const should = L * p, diff = (B - should) / should * 100;
    box.innerHTML = Math.abs(diff) > 5
      ? `<div class="verdict warn">ยอดเงินไม่ตรงกับราคาวันนี้: ${L} ลิตร ควรประมาณ ${n(Math.round(should))} บาท (ต่าง ${diff > 0 ? '+' : ''}${diff.toFixed(0)}%) ระบบจะแจ้งผู้ดูแล</div>`
      : `<div class="verdict ok">ยอดเงินตรงกับราคาน้ำมันวันนี้</div>`;
  };
  const autoFill = from => {
    const p = price(); F.man[from] = true;
    const to = from === 'fl' ? 'fb' : 'fl';
    if (!p || F.man[to] && $(to).value) { $(from + 'A').textContent = ''; fuelCheck(); return; }
    F.man[to] = false;
    const v = +$(from).value;
    $(to).value = v ? (from === 'fl' ? (v * p).toFixed(2) : (v / p).toFixed(2)) : '';
    $(to + 'A').textContent = v ? 'คำนวณจากราคาวันนี้' : '';
    $(from + 'A').textContent = '';
    fuelCheck();
  };
  $('fl').oninput = () => autoFill('fl');
  $('fb').oninput = () => autoFill('fb');
  if ($('ftype')) $('ftype').onchange = () => { const m = F.man.fl ? 'fl' : F.man.fb ? 'fb' : null; if (m && !(F.man.fl && F.man.fb)) autoFill(m); else fuelCheck(); };
  fuelCheck();
  $('receipt').onchange = async () => {
    const f = $('receipt').files[0]; if (!f) return;
    const st = $('rstat');
    try {
      P.receipt = await readPhoto(f, DEMO ? 700 : 1600, '');
      $('rImg').src = P.receipt; $('rImg').style.display = 'block'; $('rph0').style.display = 'none'; $('rshot').classList.add('has');
    } catch (e) { return toast('เปิดรูปไม่ได้ ลองถ่ายใหม่อีกครั้ง'); }
    st.className = 'rstat'; st.innerHTML = '<span class="spin"></span>กำลังอ่านใบเสร็จ…';
    try {
      const r = await call('receipt', { photo: P.receipt });
      if (!r.found) { st.className = 'rstat warn'; st.textContent = 'อ่านตัวเลขในใบเสร็จไม่ได้ กรอกเองได้เลย (แตะรูปเพื่อถ่ายใหม่)'; return; }
      if (r.liters) $('fl').value = r.liters;
      if (r.baht) $('fb').value = r.baht;
      F.man = { fl: true, fb: true };
      $('flA').textContent = r.liters ? 'อ่านจากใบเสร็จ' : ''; $('fbA').textContent = r.baht ? 'อ่านจากใบเสร็จ' : '';
      st.className = 'rstat ok';
      st.textContent = `อ่านจากใบเสร็จแล้ว ${r.liters ? r.liters + ' ลิตร ' : ''}${r.baht ? n(r.baht) + ' บาท' : ''}${r.price ? ` (${r.price} บาท/ลิตร)` : ''} ตรวจตัวเลขอีกครั้งนะครับ` + (r.demo ? ' [ตัวเลขสมมติในโหมดทดลอง]' : '');
      fuelCheck();
    } catch (e) { st.className = 'rstat warn'; st.textContent = e.message + ' กรอกตัวเลขเองได้เลย'; }
  };
  $('fuelChips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    $('fuelChips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    $('fuel').style.display = b.dataset.f === '1' ? 'block' : 'none';
    if (b.dataset.f === '0') { $('fl').value = ''; $('fb').value = ''; F.man = { fl: false, fb: false }; $('flA').textContent = $('fbA').textContent = ''; fuelCheck(); }
    else $('fl').focus();
  };
  $('submit').onclick = async () => {
    const odoV = $('odo').value;
    if (!P.photo) return toast('ถ่ายรูปหน้าปัดก่อนนะครับ');
    if (!odoV) return toast('กรอกเลขไมล์ก่อนนะครับ');
    if (+odoV < +t.startOdo) return toast(`เลขไมล์ต้องไม่น้อยกว่า ${n(t.startOdo)}`);
    if (+$('fl').value > 0 && R.requireReceipt && !P.receipt) { $('rshot').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('ถ่ายรูปใบเสร็จน้ำมันก่อนนะครับ'); }
    const b = $('submit'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try {
      if (trHas(t.id)) {
        b.textContent = 'กำลังส่งเส้นทาง GPS…';
        if (!(await trStop())) toast('ส่งเส้นทาง GPS บางส่วนไม่สำเร็จ ระบบจะบันทึกเท่าที่มี', 4000);
        b.textContent = 'กำลังบันทึก…';
      }
      const p = await pos;
      const r = await call('checkin', { tripId: t.id, odo: +odoV, photo: P.photo, photoAgeMin: P.photoAgeMin, lat: p?.lat, lng: p?.lng,
        fuelLiters: $('fl').value, fuelBaht: $('fb').value, fuelType: curType(), receipt: +$('fl').value > 0 ? P.receipt : '', note: $('note').value });
      if (trHas(t.id)) trClear();
      renderDone('คืนรถแล้ว', `<p>${esc(c.name)} รอบนี้วิ่ง ${n(r.distance)} กม.${r.fuelCostEst ? `<br>ค่าน้ำมันเที่ยวนี้ประมาณ ${n(r.fuelCostEst)} บาท` : ''}</p><p class="small">ขอบคุณครับ</p>`, r.flags);
    } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'ยืนยันคืนรถ'; }
  };
  window.scrollTo(0, 0);
}

function renderDone(title, html, flags, action) {

    $app.innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}<br><br><button class="btn sm" id="retry">ลองใหม่</button></div>`;

// ---------- รายการใช้รถ ----------
function tripCardHtml(t) {
  const f = flagsOf(t), car = carOf(t.car), exp = +t.expectedKm;
  const stops = t.destination ? String(t.destination).split('\n') : [];
  const ph = [[t.startPhoto, 'รูปเลขไมล์ตอนออก'], [t.endPhoto, 'รูปเลขไมล์ตอนคืน'], [t.receiptPhoto, 'ใบเสร็จน้ำมัน']].filter(x => x[0]).map(([u, label]) => String(u).startsWith('data:')
    ? `<img class="thumb" src="${u}" alt="${label}" title="${label}">` : `<a class="phlink" href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`).join(' ');
  const rv = t.reviewStatus === 'done';
  return `<div class="trip ${f.length ? 'fl' : ''} ${rv ? 'rv' : ''}">
    <div class="top"><span class="who">${esc(t.driver)} <span class="small">${esc(car.name)}</span></span>
      ${t.status === 'open' ? '<span class="badge open">ยังไม่คืน</span>' : `<span class="km">${n(t.distance)} กม.</span>`}</div>
    <div class="ln">${fdt(t.startTime)}${t.endTime ? ' ถึง ' + ftime(t.endTime) : ''}, ${esc(t.purpose)}</div>
    ${t.returnedBy && t.returnedBy !== t.driver ? `<div class="ln">คืนรถโดย ${esc(t.returnedBy)}</div>` : ''}
    ${stops.length ? `<div class="ln">${stops.map((x, i) => `${i + 1}) ${esc(x)}`).join('  ')}</div>` : ''}
    <div class="ln">เลขไมล์ ${n(t.startOdo)} ถึง ${n(t.endOdo) || '…'}${exp > 0 ? `, Google Maps ${n(exp)} กม. (ควรจบที่ ${n(+t.startOdo + exp)})` : ''}</div>
    ${t.fuelCostEst ? `<div class="ln">ค่าน้ำมันตามระยะทางประมาณ ${n(t.fuelCostEst)} บาท</div>` : ''}
    ${t.fuelLiters !== '' && t.fuelLiters != null ? `<div class="ln">เติมน้ำมัน${t.fuelType ? fuelLabel(t.fuelType) : ''} ${(+t.fuelLiters).toFixed(2)} ลิตร${t.fuelBaht ? ' ' + n(t.fuelBaht) + ' บาท' : ''}${t.fuelPrice ? ` (ราคาวันนั้น ${t.fuelPrice} บาท/ลิตร)` : ''}</div>` : ''}
    ${t.receiptLiters || t.receiptBaht ? `<div class="ln">ใบเสร็จระบุ ${t.receiptLiters || '?'} ลิตร ${t.receiptBaht ? n(t.receiptBaht) + ' บาท' : ''}${t.receiptDate ? ' วันที่ ' + esc(t.receiptDate) : ''}</div>` : ''}
    ${t.note ? `<div class="ln">หมายเหตุ: ${esc(t.note)}</div>` : ''}
    ${t.status === 'closed' ? (+t.gpsPoints > 0
      ? `<div class="ln">GPS ${n(t.gpsKm)} กม. จาก ${t.gpsPoints} จุด ขาดช่วงนานสุด ${t.gpsMaxGapMin} นาที${t.gpsOffrouteKm !== '' && t.gpsOffrouteKm != null ? `, ห่างจากเส้นทางที่วางไว้สูงสุด ${n(t.gpsOffrouteKm)} กม.` : ''}</div>`
      : '<div class="ln">ไม่มีข้อมูล GPS</div>') : ''}
    ${f.map(x => `<div class="fx">${esc(x)}</div>`).join('')}
    ${ph ? `<div class="ph">${ph}</div>` : ''}
    <div class="tacts">${t.status === 'closed' && +t.gpsPoints > 0 ? `<button class="btn sm soft" data-map="${esc(t.id)}">ดูเส้นทางบนแผนที่</button>` : ''}
      ${f.length && t.status === 'closed' && !rv ? `<button class="btn sm" data-review="${esc(t.id)}">ตรวจแล้ว</button>` : ''}</div>
    ${rv ? `<div class="rvbox"><b>ตรวจแล้ว</b> ${t.reviewAt ? fdt(t.reviewAt) : ''}${t.reviewNote ? `<br>${esc(t.reviewNote)}` : ''} <button class="linkbtn" data-review="${esc(t.id)}">แก้ไข</button></div>` : ''}</div>`;
}
function bindTripCards() {
  $app.querySelectorAll('[data-review]').forEach(b => b.onclick = () => reviewSheet(S.trips.find(t => t.id === b.dataset.review)));
  $app.querySelectorAll('[data-map]').forEach(b => b.onclick = () => showMap(S.trips.find(t => t.id === b.dataset.map)));

    const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${i.src}" alt="">`;

}
function drawTrips() {
  const list = monthTrips();
  const flagged = list.filter(t => flagsOf(t).length && t.status === 'closed');
  const pending = flagged.filter(t => t.reviewStatus !== 'done'), reviewed = flagged.filter(t => t.reviewStatus === 'done');
  const view = S.tripView || 'pending';
  const drivers = [...new Set([...S.data.drivers, ...list.map(t => t.driver)])].map(d => {
    const ts = list.filter(t => t.driver === d);
    return { d, trips: ts.length, km: sumOf(ts.filter(t => t.status === 'closed'), 'distance'), flags: ts.filter(t => flagsOf(t).length).length, pend: ts.filter(t => flagsOf(t).length && t.reviewStatus !== 'done' && t.status === 'closed').length };
  }).filter(x => x.trips);
  const shown = view === 'pending' ? pending : view === 'reviewed' ? reviewed : list;
  $app.innerHTML = `
    <div class="bar"><input id="month" class="f" type="month" value="${S.month}" aria-label="เดือน"><span class="sp"></span><button class="btn sm line" id="csv">ดาวน์โหลด Excel</button></div>
    <div class="seg" role="tablist">
      <button data-v="pending" class="${view === 'pending' ? 'on' : ''}">รอตรวจ <i>${pending.length}</i></button>
      <button data-v="reviewed" class="${view === 'reviewed' ? 'on' : ''}">ตรวจแล้ว <i>${reviewed.length}</i></button>
      <button data-v="all" class="${view === 'all' ? 'on' : ''}">ทั้งหมด <i>${list.length}</i></button></div>
    ${shown.length ? shown.map(tripCardHtml).join('') : `<div class="empty">${view === 'pending' ? (flagged.length ? 'ตรวจครบทุกรายการแล้ว' : 'เดือนนี้ไม่มีรายการผิดปกติ') : 'ไม่มีรายการ'}</div>`}
    <h3 class="h2">สรุปรายคน</h3>
    ${drivers.length ? `<table><tr><th>ชื่อ</th><th class="r">ครั้ง</th><th class="r">กม.</th><th class="r">ถูกเตือน</th><th class="r">รอตรวจ</th></tr>
      ${drivers.map(x => `<tr><td>${esc(x.d)}</td><td class="r">${x.trips}</td><td class="r">${n(x.km) || 0}</td><td class="r">${x.flags}</td><td class="r">${x.pend ? `<span class="badge bad">${x.pend}</span>` : '0'}</td></tr>`).join('')}</table>` : '<div class="empty">เดือนนี้ยังไม่มีการใช้รถ</div>'}`;
  $app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { S.tripView = b.dataset.v; drawTrips(); });
  $('month').onchange = e => { S.month = e.target.value || monthKey(new Date()); drawTrips(); };
  $('csv').onclick = () => downloadCsv(list);
  bindTripCards();
}
const drawReport = () => { adminHeader(S.tab === 'overview' ? 'ภาพรวม' : 'รายการใช้รถ'); (S.tab === 'overview' ? drawOverview : drawTrips)(); };
