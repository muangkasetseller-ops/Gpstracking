  $app.innerHTML = `<h2 class="title">ประวัติการใช้รถ</h2><p class="lead">ย้อนหลัง 60 วันของ ${esc(me())}</p>
    <div class="mstats"><div><b>${m.length}</b><span>ครั้งเดือนนี้</span></div><div><b>${n(sumOf(m, 'distance')) || 0}</b><span>กม. เดือนนี้</span></div></div>
    <div class="mt">${list.length ? list.map(t => {
      const car = carOf(t.car);
      return `<div class="trip"><div class="top"><span class="who">${fdt(t.startTime)} <span class="small">${esc(car.name)}</span></span>
        ${t.status === 'open' ? '<span class="badge open">กำลังใช้</span>' : `<span class="km">${n(t.distance)} กม.</span>`}</div>
        <div class="ln">${esc(t.purpose)}${t.destination ? ': ' + String(t.destination).split('\n').map(esc).join(', ') : ''}</div>
        <div class="ln">เลขไมล์ ${n(t.startOdo)} ถึง ${n(t.endOdo) || '…'}${t.fuelLiters ? `, เติมน้ำมัน ${(+t.fuelLiters).toFixed(2)} ลิตร` : ''}</div></div>`;
    }).join('') : '<div class="empty">ยังไม่มีประวัติการใช้รถ</div>'}</div>`;
}


// ---------- หน้าตั้งค่า (ผู้ดูแลเท่านั้น) ----------
async function renderSettings() {
  S.tab = 'settings'; S.adminPin = S.adminPin || store.get('fleet_pin');
  adminHeader('ตั้งค่า');
  $app.classList.remove('wide');
  $app.innerHTML = '<p class="empty">กำลังโหลด…</p>';
  let st;
  try { st = await call('settingsGet', { pin: S.adminPin }); }
  catch (e) { $app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const E = { cars: st.cars.map(c => ({ ...c })), drivers: st.drivers.map(d => ({ ...d })) };
  const fuelOpts = sel => st.fuelTypes.map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(f.label)}</option>`).join('');
  const randPin = () => { let p; do { p = String(Math.floor(100000 + Math.random() * 900000)); } while (E.drivers.some(d => d.pin === p) || p === '999999'); return p; };
  const draw = () => {
    $app.innerHTML = `
      <h2 class="title">ตั้งค่า</h2><p class="lead">เฉพาะผู้ดูแลเท่านั้นที่เข้าหน้านี้ได้ แก้แล้วกดบันทึกด้านล่าง</p>

      <h3 class="h2">ที่ตั้งบริษัท</h3>
      <div class="sbox"><div class="lrow"><div class="lwho"><b>${st.company ? esc(st.company.name || 'ตั้งไว้แล้ว') : 'ยังไม่ได้ตั้ง'}</b>
        <span>${st.company ? `<a href="https://www.google.com/maps?q=${st.company.lat},${st.company.lng}" target="_blank" rel="noopener">ดูตำแหน่งใน Google Maps ↗</a>` : 'ต้องตั้งก่อน ระบบถึงจะคำนวณระยะทางได้'}</span></div>
        <button class="btn sm ${st.company ? 'line' : ''}" id="sHq">${st.company ? 'เปลี่ยน' : 'ตั้งเลย'}</button></div></div>

      <h3 class="h2">รถบริษัท</h3>
      ${E.cars.map((c, i) => `<div class="sbox ${c.active === false ? 'off' : ''}">
        <div class="srow"><div><div class="lbl">รุ่นรถ</div><input class="f" data-c="${i}" data-k="name" value="${esc(c.name)}" placeholder="เช่น Toyota Hilux Revo"></div>
          <div><div class="lbl">ทะเบียน (รวมจังหวัด)</div><input class="f" data-c="${i}" data-k="plate" value="${esc(c.plate)}" placeholder="เช่น กข 1234 กรุงเทพมหานคร"></div></div>
        <div class="srow"><div><div class="lbl">ชนิดน้ำมัน</div><select class="f" data-c="${i}" data-k="fuel">${fuelOpts(c.fuel)}</select></div>
          <div><div class="lbl">กินน้ำมันประมาณ (กม./ลิตร)</div><input class="f" type="number" inputmode="decimal" data-c="${i}" data-k="kmPerLiter" value="${esc(c.kmPerLiter)}"></div></div>
        <label class="tog"><input type="checkbox" data-c="${i}" data-k="active" ${c.active !== false ? 'checked' : ''}> ใช้งานอยู่ <span class="small">(ปิดเมื่อขายรถหรือเลิกใช้ ประวัติเดิมยังอยู่)</span></label>
      </div>`).join('')}
      <button class="add" id="sAddCar" style="padding-left:0">+ เพิ่มรถ</button>

      <h3 class="h2">พนักงานที่ใช้รถ</h3>
      <p class="small" style="margin-top:-6px">PIN ต้องเป็นตัวเลข 4–8 หลักและห้ามซ้ำกัน กด "สุ่ม" เพื่อสร้าง PIN ใหม่ แล้วแจ้งพนักงานแต่ละคนเป็นการส่วนตัว</p>
      ${E.drivers.map((d, i) => `<div class="sbox ${d.active === false ? 'off' : ''}">
        <div class="srow"><div><div class="lbl">ชื่อ</div><input class="f" data-d="${i}" data-k="name" value="${esc(d.name)}" placeholder="ชื่อเล่นหรือชื่อจริง"></div>
          <div><div class="lbl">PIN</div><div class="pinrow"><input class="f" data-d="${i}" data-k="pin" value="${esc(d.pin)}" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn sm line" data-rand="${i}" type="button">สุ่ม</button></div></div></div>
        <label class="tog"><input type="checkbox" data-d="${i}" data-k="active" ${d.active !== false ? 'checked' : ''}> ใช้งานอยู่ <span class="small">(ปิดเมื่อพนักงานลาออก PIN นี้จะเข้าไม่ได้ทันที)</span></label>
      </div>`).join('')}
      <button class="add" id="sAddDrv" style="padding-left:0">+ เพิ่มพนักงาน</button>

      <h3 class="h2">PIN ผู้ดูแล</h3>
      <div class="sbox">${st.adminDefault ? '<p class="note warn" style="text-align:left;margin:0 0 10px">ยังเป็นค่าเริ่มต้น 9999 ควรเปลี่ยน</p>' : ''}
        <div class="srow"><div><div class="lbl">PIN ผู้ดูแลใหม่</div><input class="f" id="sAdm" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="เว้นว่างถ้าไม่เปลี่ยน"></div>
          <div><div class="lbl">พิมพ์ PIN ใหม่อีกครั้ง</div><input class="f" id="sAdm2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div></div>
      <h3 class="h2">QR code ติดในรถ</h3>

        <div class="qrs">${E.cars.filter(c => c.id && c.active !== false).map(c => `<div class="qr">${plate(c.plate)}<div class="code" data-u="${esc(location.href.split(/[?#]/)[0] + '?car=' + encodeURIComponent(c.id))}"></div>
          <div style="font-family:var(--disp);font-weight:600">${esc(c.name)}</div><div class="small">สแกนเพื่อรับหรือคืนรถ</div></div>`).join('')}</div>
        <div class="mt"><button class="btn sm line" id="print">พิมพ์ QR code</button></div></div>
      <div class="dock"><button class="btn" id="sSave">บันทึกการตั้งค่า</button></div>`;
    $app.querySelectorAll('.code').forEach(el => { try { new QRCode(el, { text: el.dataset.u, width: 170, height: 170, colorDark: '#111113' }); } catch (e) { el.textContent = el.dataset.u; } });
    $('print').onclick = () => { document.body.classList.add('printqr'); try { window.print(); } catch (e) { toast('เครื่องนี้สั่งพิมพ์ไม่ได้'); } };
    $app.querySelectorAll('[data-c]').forEach(el => el.oninput = el.onchange = () => { const c = E.cars[+el.dataset.c]; c[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; if (el.type === 'checkbox') draw(); });
    $app.querySelectorAll('[data-d]').forEach(el => el.oninput = el.onchange = () => { const d = E.drivers[+el.dataset.d]; d[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value.trim(); if (el.type === 'checkbox') draw(); });
    $app.querySelectorAll('[data-rand]').forEach(b => b.onclick = () => { E.drivers[+b.dataset.rand].pin = randPin(); draw(); });
    $('sAddCar').onclick = () => { E.cars.push({ id: '', name: '', plate: '', fuel: 'diesel', kmPerLiter: 12, active: true }); draw(); };
    $('sAddDrv').onclick = () => { E.drivers.push({ name: '', pin: randPin(), active: true }); draw(); };
    $('sHq').onclick = () => companySheet(() => renderSettings());
    $('sSave').onclick = async () => {
      const a1 = $('sAdm').value.trim(), a2 = $('sAdm2').value.trim();
      if (a1 && a1 !== a2) return toast('PIN ผู้ดูแลใหม่ทั้ง 2 ช่องไม่ตรงกัน');
      if (a1 && !/^\d{4,8}$/.test(a1)) return toast('PIN ผู้ดูแลต้องเป็นตัวเลข 4–8 หลัก');
      const b = $('sSave'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
      try {
        await call('settingsSave', { pin: S.adminPin, cars: E.cars, drivers: E.drivers, adminPin: a1 || undefined });
        if (a1) { S.adminPin = a1; store.set('fleet_pin', a1); }
        S.data = await call('init', { pin: S.adminPin });
        toast('บันทึกการตั้งค่าแล้ว'); renderSettings();
      } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'บันทึกการตั้งค่า'; }
    };
  };
  draw();
}

// ตั้งที่ตั้งบริษัท: เลื่อนแผนที่ให้หมุดตรงกลางอยู่ที่บริษัท (แบบแอปเรียกรถ)
function companySheet(after) {
  window.__afterHq = typeof after === 'function' ? after : null;
  const cur = S.data.rules.company;
  const o = document.createElement('div'); o.className = 'mapov';
  o.innerHTML = `<div class="maphead"><b>ตั้งที่ตั้งบริษัท</b><button id="hqclose">ปิด</button></div>
    <div style="position:relative;flex:1">
      <div id="hqmap" style="position:absolute;inset:0"></div>
      <div class="centerpin" aria-hidden="true">${hqIcon().options.html}</div>
      <div class="hqsearch"><div class="stop" style="margin:0"><input class="f" id="hqq" placeholder="ค้นหาชื่อบริษัท หรือวางลิงก์ Google Maps" enterkeyhint="search"><button class="btn sm" id="hqfind">ค้นหา</button></div><div id="hqres"></div></div>
    </div>
    <div class="hqfoot">
      <p class="small" style="margin:0 0 10px">เลื่อนแผนที่ให้หมุดตรงกลางอยู่ที่บริษัท หรือกดใช้ตำแหน่งปัจจุบันถ้าคุณอยู่ที่บริษัท</p>
      <input class="f" id="hqname" placeholder="ชื่อเรียก เช่น บริษัท เมืองเกษตร" value="${esc(cur?.name && cur.name !== 'บริษัท' ? cur.name : '')}">
      <div class="two mt"><button class="btn line" id="hqhere">ใช้ตำแหน่งปัจจุบัน</button><button class="btn" id="hqsave">บันทึกตำแหน่งนี้</button></div></div>`;
  document.body.appendChild(o);
  $('hqclose').onclick = () => o.remove();
  if (!window.L) { $('hqmap').innerHTML = '<p class="empty" style="margin:16px">โหลดแผนที่ไม่ได้ ใช้ปุ่ม "ใช้ตำแหน่งปัจจุบัน" แทนได้</p>'; }
  const m = window.L ? makeMap('hqmap') : null;
  if (m) m.setView(cur ? [cur.lat, cur.lng] : [13.7563, 100.5018], cur ? 17 : 11);
  let picked = null; // ใช้เมื่อไม่มีแผนที่
  $('hqhere').onclick = async () => {
    $('hqhere').textContent = 'กำลังหาตำแหน่ง…';
    const p = await getPos();
    $('hqhere').textContent = 'ใช้ตำแหน่งปัจจุบัน';
    if (!p) return toast('หาตำแหน่งไม่ได้ ตรวจว่าอนุญาตให้เว็บใช้ตำแหน่งแล้ว', 4000);
    picked = p; if (m) m.setView([p.lat, p.lng], 18); else toast('ได้ตำแหน่งแล้ว กดบันทึกได้เลย');
  };
  const find = async () => {
    const q = $('hqq').value.trim(); if (!q) return;
    $('hqres').innerHTML = '<div class="res"><div class="msg" style="color:var(--muted)">กำลังค้นหา…</div></div>';
    try {
      const rs = await call('place', { q, pin: S.adminPin });
      $('hqres').innerHTML = `<div class="res">${rs.length ? rs.map((r, i) => `<button type="button" data-i="${i}"><b>${esc(r.name)}</b><span>${esc(r.address || '')}</span></button>`).join('') : '<div class="msg">ไม่พบ ลองพิมพ์ชื่ออื่น หรือวางลิงก์จาก Google Maps</div>'}</div>`;
      $('hqres').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
        const r = rs[+b.dataset.i]; picked = r; $('hqres').innerHTML = '';
        if (!$('hqname').value) $('hqname').value = r.name;
        if (m) m.setView([r.lat, r.lng], 18);
      });
    } catch (e) { $('hqres').innerHTML = ''; toast(e.message, 4000); }
  };
  $('hqfind').onclick = find;
  $('hqq').onkeydown = e => { if (e.key === 'Enter') find(); };
  $('hqsave').onclick = async () => {
    const c = m ? m.getCenter() : picked;
    if (!c) return toast('เลือกตำแหน่งก่อนนะครับ');
    try {
      const r = await call('setCompany', { pin: S.adminPin, lat: c.lat, lng: c.lng, name: $('hqname').value.trim() || 'บริษัท' });
      S.data.rules.company = r; o.remove(); (window.__afterHq || drawReport)(); toast('บันทึกที่ตั้งบริษัทแล้ว');
    } catch (e) { toast(e.message, 4000); }
  };
}

// ผู้ดูแลบันทึกว่าตรวจรายการแล้ว พร้อมหมายเหตุ
function reviewSheet(t) {
  const o = document.createElement('div'); o.className = 'overlay';
  const quick = ['สอบถามแล้ว มีเหตุผลที่รับได้', 'ตักเตือนแล้ว', 'ให้ชดใช้ค่าน้ำมันแล้ว', 'ข้อมูลผิดพลาดจากระบบ'];
  o.innerHTML = `<div class="sheet" role="dialog" aria-label="บันทึกการตรวจ">
    <p style="margin-bottom:6px">ตรวจรายการนี้แล้ว</p>
    <div class="small" style="margin-bottom:12px">${esc(t.driver)}, ${esc(carOf(t.car).name)} ${fdt(t.startTime)}</div>
    <div class="chips" id="rq">${quick.map(q => `<button class="chip" type="button">${esc(q)}</button>`).join('')}</div>
    <textarea id="rnote" class="f mt" placeholder="บันทึกผลการตรวจ (ถ้ามี)">${esc(t.reviewNote || '')}</textarea>
    <div class="two mt"><button class="btn line" id="rcancel">ยกเลิก</button><button class="btn" id="rsave">บันทึก</button></div>
    ${t.reviewStatus === 'done' ? '<button class="linkbtn mt" id="rundo" style="display:block;margin:12px auto 0">ย้ายกลับไปรายการที่ต้องตรวจ</button>' : ''}</div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.onclick = e => { if (e.target === o) close(); };
  $('rcancel').onclick = close;
  $('rq').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; const v = $('rnote').value.trim(); $('rnote').value = v ? v + ' ' + b.textContent : b.textContent; };
  const save = async undo => {
    try {
      const r = await call('review', { pin: S.adminPin, tripId: t.id, note: $('rnote').value, undo });
      Object.assign(t, { reviewStatus: r.reviewStatus, reviewNote: r.reviewNote, reviewAt: r.reviewAt });
      close(); drawReport(); toast(undo ? 'ย้ายกลับไปรายการที่ต้องตรวจแล้ว' : 'บันทึกว่าตรวจแล้ว');
    } catch (e) { toast(e.message, 4000); }
  };
  $('rsave').onclick = () => save(false);
  if ($('rundo')) $('rundo').onclick = () => save(true);
}

function downloadCsv(list) {
  const cols = [['startTime', 'เวลารับรถ'], ['endTime', 'เวลาคืนรถ'], ['car', 'รถ'], ['driver', 'ผู้ใช้'], ['purpose', 'งาน'], ['destination', 'ปลายทาง'],
    ['startOdo', 'ไมล์เริ่ม'], ['endOdo', 'ไมล์จบ'], ['distance', 'ระยะทาง (กม.)'], ['expectedKm', 'ระยะที่ควรเป็น (กม.)'],
    ['fuelLiters', 'เติมน้ำมัน (ลิตร)'], ['fuelBaht', 'เติมน้ำมัน (บาท)'], ['fuelPrice', 'ราคาน้ำมันวันนั้น (บาท/ลิตร)'], ['fuelCostEst', 'ค่าน้ำมันตามระยะ (บาท)'], ['note', 'หมายเหตุ'], ['flags', 'แจ้งเตือน'], ['startPhoto', 'รูปรับรถ'], ['endPhoto', 'รูปคืนรถ'], ['receiptPhoto', 'รูปใบเสร็จ'], ['receiptLiters', 'ใบเสร็จ (ลิตร)'], ['receiptBaht', 'ใบเสร็จ (บาท)'], ['returnedBy', 'คืนรถโดย'], ['reviewStatus', 'ตรวจแล้ว'], ['reviewNote', 'บันทึกการตรวจ']];
  const val = (t, k) => {
    let v = t[k] ?? '';
    if (k === 'car') v = carOf(v).name + ' ' + carOf(v).plate;
    if ((k === 'startTime' || k === 'endTime') && v) v = new Date(v).toLocaleString('th-TH');
    if (/Photo$/.test(k) && String(v).startsWith('data:')) v = '';
    return '"' + String(v).replace(/"/g, '""').replace(/\n/g, ' ') + '"';
  };
  const csv = '﻿' + [cols.map(c => c[1]).join(','), ...list.map(t => cols.map(c => val(t, c[0])).join(','))].join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `การใช้รถ-${S.month}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { toast('ดาวน์โหลดไม่ได้ในหน้านี้'); }
}

// ติดตั้งเป็นแอป (PWA)
const PWA = { evt: null };
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !DEMO_PREVIEW()) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
function DEMO_PREVIEW() { return /claude|claudeusercontent/.test(location.hostname); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.evt = e; installBar(); });
window.addEventListener('appinstalled', () => { PWA.evt = null; store.set('fleet_noinstall', '1'); $('instbar') && $('instbar').remove(); });
function installBar() {
  if (standalone() || store.get('fleet_noinstall') || $('instbar')) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (!PWA.evt && !ios) return;
  const b = document.createElement('div'); b.id = 'instbar'; b.className = 'instbar';
  b.innerHTML = `<span class="ib-ic">${ICON.car}</span><span class="ib-tx"><b>ติดตั้งเป็นแอป</b><br>${PWA.evt ? 'เปิดจากหน้าจอหลักได้เลย ใช้งานเต็มจอ' : 'กดปุ่มแชร์ <b>⬆︎</b> แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"'}</span>
    ${PWA.evt ? '<button class="btn sm" id="ibGo">ติดตั้ง</button>' : ''}<button class="ib-x" id="ibX" aria-label="ปิด">×</button>`;
  document.body.appendChild(b);
  $('ibX').onclick = () => { store.set('fleet_noinstall', '1'); b.remove(); };
  if ($('ibGo')) $('ibGo').onclick = async () => { PWA.evt.prompt(); try { await PWA.evt.userChoice; } catch (e) {} PWA.evt = null; b.remove(); };
}
setTimeout(installBar, 2500);
boot();
