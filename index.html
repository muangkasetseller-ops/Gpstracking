:root{
  --paper:#F3F5EF; --panel:#FFFFFF; --ink:#16241B; --muted:#5E6E64; --line:#D7DFD3;
  --green:#1F6B45; --green-d:#174F34; --leaf:#E4EFE0;
  --yellow:#F2C230; --yellow-l:#FDF3CF;
  --brick:#B4441A; --brick-l:#FBECE4;
  --disp:'Chakra Petch',system-ui,sans-serif; --body:'Anuphan',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.55;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- หัวเว็บ ---------- */
header{background:var(--green-d);color:#fff;position:sticky;top:0;z-index:5}
.hwrap{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--yellow);color:var(--green-d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand h1{font-family:var(--disp);font-size:19px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlink{background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:5px 13px;font-size:15px;white-space:nowrap}
.back{background:none;border:0;color:#fff;padding:4px 6px 4px 0;display:flex}
main{max-width:560px;margin:0 auto;padding:22px 16px 130px}
main.wide{max-width:920px}

/* ---------- ตัวอักษร ---------- */
.title{font-family:var(--disp);font-size:28px;font-weight:600;line-height:1.2;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 22px}
.small{font-size:14px;color:var(--muted)}
.demo{background:var(--yellow-l);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:20px;color:#6b5108}
.demo a{color:inherit}

/* ---------- มิเตอร์เลขไมล์ (จุดเด่นของหน้า) ---------- */
.odo{display:inline-flex;gap:3px;padding:4px;background:var(--ink);border-radius:8px;font-family:var(--disp);font-weight:700;vertical-align:middle}
.odo i{font-style:normal;width:1.05em;text-align:center;background:linear-gradient(#2a3a30,#1d2b22 48%,#16241b 52%,#24342a);color:#F4F6F0;border-radius:3px;line-height:1.55;font-variant-numeric:tabular-nums}
.odo i.z{color:#56665c}
.odo .u{font-family:var(--body);font-weight:500;font-size:.55em;color:#9fb0a5;align-self:center;padding:0 4px 0 3px}
.odo.sm{font-size:17px}
.odo.lg{font-size:clamp(24px,8.4vw,34px);padding:6px;gap:4px;border-radius:12px}
.odo.lg i{border-radius:5px}
.odo.hl i{background:var(--yellow);color:var(--ink)}
.odo.hl i.z{color:#b08e1d}
.odo.hl{background:#d9a91c}
.odo.hl .u{color:#5c4706}
.route .odo.lg,.done-box .odo.lg{font-size:clamp(22px,7vw,30px)}
.compare .odo.sm{font-size:16px}.compare .odo .u{display:none}
.odo-in{position:relative;display:flex;justify-content:center;padding:4px 0}
.odo-in input{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;cursor:text}
.odo-in:focus-within .odo{box-shadow:0 0 0 4px var(--yellow)}
.odo-in.empty .odo i{color:#56665c}

/* ---------- ป้ายทะเบียน ---------- */
.plate{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:7px;padding:3px 12px 2px;line-height:1.15;min-width:118px}
.plate b{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.5px}
.plate span{font-size:11px;color:var(--ink)}

/* ---------- รายการรถหน้าแรก ---------- */
.cars{display:grid;gap:14px}
.car{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.car.mine{border:2px solid var(--green);background:linear-gradient(var(--leaf),#fff 70%)}
.car-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.car h2{font-family:var(--disp);font-size:20px;font-weight:600;margin:12px 0 2px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:500;white-space:nowrap;padding-top:4px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.free{color:var(--green)}.status.busy{color:var(--muted)}.status.mine{color:var(--green-d)}
.car .who{color:var(--muted);font-size:15px;margin:0}
.car .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 16px}

/* ---------- ปุ่ม ---------- */
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;border:0;border-radius:12px;padding:15px 18px;font-family:var(--disp);font-weight:600;font-size:19px;background:var(--green);color:#fff}
.btn:active{background:var(--green-d)}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:var(--leaf);color:var(--green-d)}
.btn.sm{width:auto;padding:9px 14px;font-size:16px;border-radius:10px}
.btn:disabled{opacity:.55}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);z-index:4}
.dock .btn{max-width:528px;margin:0 auto}

/* ---------- ขั้นตอนแบบเส้นต่อ ---------- */
.ctx{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.ctx .t{font-family:var(--disp);font-size:22px;font-weight:600;line-height:1.2}
.steps{margin:0;padding:0;list-style:none}
.st{position:relative;padding:0 0 30px 46px}
.st::before{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st .dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.st.done .dot{background:var(--green);border-color:var(--green);color:#fff;font-size:0}
.st.done .dot::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.st.done::before{background:var(--green)}
.st h3{font-family:var(--disp);font-size:19px;font-weight:600;margin:2px 0 12px;line-height:1.3}
.st h3 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
.note{font-size:15px;color:var(--muted);margin-top:10px;text-align:center}
.note.ok{color:var(--green)}.note.warn{color:var(--brick)}

/* กล้อง */
.shot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:148px;border:2px dashed #9fb7a6;border-radius:14px;background:var(--panel);color:var(--green-d);font-weight:500;cursor:pointer}
.shot svg{width:40px;height:40px}
.shot img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.shot.has{border:0;padding:0;background:none;min-height:0}

/* ช่องกรอก */
input.f,textarea.f,select.f{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input.f:focus,textarea.f:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--leaf)}
textarea.f{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:16px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mt{margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:14px;color:var(--muted);margin-bottom:4px}

/* จุดแวะ */
.stop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stop .n{font-family:var(--disp);font-weight:700;width:26px;text-align:center;color:var(--green)}
.stop input{flex:1}
.stop .rm{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:4px 6px}
.stop .btn{flex-shrink:0}
.pick{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;background:var(--panel);border:1.5px solid var(--green);border-radius:12px;padding:10px 6px 10px 0}
.pick .n,.stop .n{padding-top:2px}
.pick .pk{flex:1;min-width:0}
.pick .pk b{display:block;font-weight:600}
.pick .pk span{display:block;font-size:13px;color:var(--muted)}
.pick .rm{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:0 8px}
.res{margin:-2px 0 12px 34px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}

function monthKey(d) { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    try {
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    } catch (e) { res(null); }
  });
}
// ย่อรูป + ประทับเวลา/ทะเบียนรถลงบนรูป
async function readPhoto(file, max, stamp) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0, c.width, c.height);
    if (stamp) {
      const fs = Math.max(12, Math.round(c.width / 32));
      g.font = `600 ${fs}px sans-serif`;
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, c.height - fs * 1.8, c.width, fs * 1.8);
      g.fillStyle = '#fff'; g.fillText(stamp, fs * 0.5, c.height - fs * 0.6);
    }
    return c.toDataURL('image/jpeg', stamp ? 0.75 : 0.85);
  } finally { URL.revokeObjectURL(url); }
}

function ageText(min) {
  min = Math.round(+min);
  if (min < 60) return min + ' นาที';
  if (min < 48 * 60) return Math.round(min / 60) + ' ชั่วโมง';
  if (min < 60 * 1440) return Math.round(min / 1440) + ' วัน';
  if (min < 365 * 1440) return Math.round(min / 43200) + ' เดือน';
  return (min / 525600).toFixed(1).replace('.0', '') + ' ปี';
}
// ---------- คำนวณ GPS (ใช้ทั้งโหมดทดลองและหน้าจอ) ----------
function kmBetween(a, b) {
  const r = x => x * Math.PI / 180, R = 6371;
  const s = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function segDistKm(p, a, b) {
  const k = Math.cos(p.lat * Math.PI / 180) * 111.32, K = 110.57;
  const ax = (a.lng - p.lng) * k, ay = (a.lat - p.lat) * K, bx = (b.lng - p.lng) * k, by = (b.lat - p.lat) * K;
  const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy, u = L ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L)) : 0;
  return Math.hypot(ax + u * dx, ay + u * dy);
}
function gpsStats(pts, startMs, endMs, stops, company) {
  pts = pts.slice().sort((a, b) => a.t - b.t);
  const out = { points: pts.length, km: 0, maxGapMin: 0, gapAt: '', offrouteKm: null, offrouteAt: '' };
  if (!pts.length) return out;
  const hm = ms => new Date(ms).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  const edges = [startMs, ...pts.map(p => p.t), endMs];
  for (let i = 1; i < edges.length; i++) {
    const g = Math.round((edges[i] - edges[i - 1]) / 60000);
    if (g > out.maxGapMin) { out.maxGapMin = g; out.gapAt = `${hm(edges[i - 1])}–${hm(edges[i])} น.`; }
  }
  for (let i = 1; i < pts.length; i++) {
    const d = kmBetween(pts[i - 1], pts[i]), h = (pts[i].t - pts[i - 1].t) / 36e5;
    if (d >= 0.02 && (h <= 0 || d / h < 200)) out.km += d;
  }
  out.km = Math.round(out.km * 10) / 10;
  const st = (stops || []).filter(x => x.lat !== '' && x.lat != null).map(x => ({ lat: +x.lat, lng: +x.lng }));
  if (company && st.length) {
    const path = [company, ...st, company];
    let worst = 0, at = 0;
    pts.forEach(p => { let b = Infinity; for (let i = 1; i < path.length; i++) b = Math.min(b, segDistKm(p, path[i - 1], path[i])); if (b > worst) { worst = b; at = p.t; } });
    out.offrouteKm = Math.round(worst * 10) / 10; out.offrouteAt = at ? hm(at) + ' น.' : '';
  }
  return out;
}
function gpsFlags(g, dist, R) {
  const f = [];
  if (!g.points) { if (R.gpsRequired) f.push('ไม่ได้เปิดบันทึกเส้นทาง GPS ระหว่างใช้รถ'); return f; }
  if (g.maxGapMin >= R.gpsGapMin) f.push(`GPS ขาดช่วงนานสุด ${g.maxGapMin} นาที (${g.gapAt}) อาจปิดหน้าจอหรือปิดเว็บระหว่างขับ`);
  if (g.offrouteKm != null && g.offrouteKm > R.offrouteKm) f.push(`รถออกนอกเส้นทางที่วางไว้ ไกลสุด ${g.offrouteKm} กม. (เวลา ${g.offrouteAt})`);
  if (dist > g.km * 1.3 + 10 && g.maxGapMin < R.gpsGapMin) f.push(`เลขไมล์ ${n(dist)} กม. มากกว่าระยะจาก GPS (${g.km} กม.)`);
  return f;
}

function genTrack(path, startMs, stepKm) {
  const out = []; let t = startMs + 4 * 60000;

// มิเตอร์เลขไมล์: ตัวเลขในช่องแบบหน้าปัดรถ
function odo(v, cls = '', digits = 6) {
  const s = v === '' || v == null || isNaN(+v) ? '' : String(Math.round(+v));
  const len = Math.max(digits, s.length), pad = s.padStart(len, '0');
  const lead = len - s.length;
  return `<span class="odo ${cls}" aria-label="${s ? n(s) + ' กิโลเมตร' : 'ยังไม่ได้กรอก'}">${[...pad].map((d, i) => `<i class="${i < lead ? 'z' : ''}">${d}</i>`).join('')}<span class="u">กม.</span></span>`;
}
function odoInput(id) {
  return `<div class="odo-in empty" id="${id}Wrap"><div id="${id}View">${odo('', 'lg')}</div>
    <input id="${id}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" aria-label="เลขไมล์"></div>`;
}
function bindOdoInput(id, onChange) {
  const inp = $(id);
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 7);
    $(id + 'View').innerHTML = odo(inp.value, 'lg');
    $(id + 'Wrap').classList.toggle('empty', !inp.value);
    onChange && onChange(inp.value ? +inp.value : 0);
  });
}

// ป้ายทะเบียน
function plate(p) {
  const parts = String(p || '').trim().split(/\s+/);
  const prov = parts.length > 1 && !/\d/.test(parts[parts.length - 1]) ? parts.pop() : '';
  return `<span class="plate"><b>${esc(parts.join(' '))}</b>${prov ? `<span>${esc(prov)}</span>` : ''}</span>`;
}

function ask(msg, yesLabel, yes) {
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet" role="dialog"><p>${esc(msg)}</p>
    <div class="two"><button class="btn line" data-a="0">ยกเลิก</button><button class="btn" data-a="1">${esc(yesLabel)}</button></div></div>`;
  o.onclick = e => { const a = e.target.dataset.a; if (a === undefined && e.target !== o) return; o.remove(); if (a === '1') yes(); };
  document.body.appendChild(o);
}

async function boot() {
  $app.classList.remove('wide');
  if (!store.get('fleet_pin') || !me()) return renderLogin();
  header('รถบริษัท');
  try {
    S.data = await call('init');
  } catch (e) {
    if (/PIN/.test(e.message)) { logout(); return renderLogin('PIN นี้ใช้ไม่ได้แล้ว กรุณาเข้าใช้งานใหม่'); }
    $app.innerHTML = `<div class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}<br><br><button class="btn sm" onclick="boot()">ลองใหม่</button></div>`;
    return;
  }
  const q = new URLSearchParams(location.search).get('car');
  if (q && S.data.cars.some(c => c.id === q)) {
    history.replaceState(null, '', location.pathname);
    return openCar(q);
  }
  renderHome();
}
function logout() { store.del('fleet_pin'); store.del('fleet_driver'); }

function renderLogin(err) {
  header('รถบริษัท');
  let pin = '';
  $app.innerHTML = `<div class="login">
    <h2 class="title">เข้าใช้งาน</h2><p class="lead">กรอก PIN ของคุณ ระบบจะรู้ว่าใครเป็นคนใช้รถจาก PIN นี้</p>
    <div class="pdots" id="pdots" aria-live="polite"></div>
    <p class="note warn" id="perr">${err ? esc(err) : ''}</p>
    <div class="keypad" id="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, 'del'].map(k => k === '' ? '<span></span>'
      : `<button type="button" data-k="${k}" aria-label="${k === 'del' ? 'ลบ' : k}">${k === 'del' ? '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m16 9-5 6M11 9l5 6"/></svg>' : k}</button>`).join('')}</div>
    ${DEMO ? '<p class="demo" style="margin-top:20px">โหมดทดลอง: สมชาย 111111, สมหญิง 222222, สมศักดิ์ 333333</p>' : ''}</div>`;
  const draw = () => { $('pdots').innerHTML = Array.from({ length: 6 }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join(''); };
  const submit = async () => {
    $('perr').textContent = 'กำลังตรวจสอบ…'; $('perr').className = 'note';
    try {
      const r = await call('login', { pin });
      store.set('fleet_pin', pin); store.set('fleet_driver', r.name);
      boot();
    } catch (e) {
      $('perr').className = 'note warn'; $('perr').textContent = e.message;
      $('pdots').classList.add('shake'); setTimeout(() => $('pdots') && $('pdots').classList.remove('shake'), 400);
      pin = ''; draw();
    }
  };
  const press = k => {
    if (k === 'del') pin = pin.slice(0, -1);
    else if (pin.length < 6) pin += k;
    draw();
    if (pin.length === 6) submit();
  };
  $('keypad').onclick = e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); };
  document.onkeydown = e => { if (!$('keypad')) { document.onkeydown = null; return; } if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };

}

// ---------- GPS โหมดกำลังขับ ----------
// เก็บพิกัดจากมือถือระหว่างใช้รถ: กันจอดับ, เก็บทุก ~15 วินาทีหรือทุก 30 ม., ส่งขึ้นระบบทุก 20 วินาที
// ถ้าเน็ตหลุดจะค้างไว้ในเครื่องแล้วส่งภายหลัง ถ้าปิดเว็บแล้วเปิดใหม่ กด "บันทึกเส้นทางต่อ" ได้
const TR = { on: false, st: null, watch: null, lock: null, timer: null, tick: null, sim: null, wakeOk: null, detour: 0 };
function trLoad() { try { return JSON.parse(store.get('fleet_track') || 'null'); } catch (e) { return null; } }
function trSave() { try { store.set('fleet_track', JSON.stringify(TR.st)); } catch (e) {} }
function trHas(tripId) { TR.st = TR.st || trLoad(); return !!(TR.st && TR.st.tripId === tripId); }

async function trStart(trip) {
  if (!trHas(trip.id)) TR.st = { tripId: trip.id, start: Date.now(), km: 0, n: 0, last: null, queue: [], pts: [], sent: null, err: '' };
  if (TR.on) return;
  TR.on = true; TR.st.err = ''; trSave();
  await trWake();
  if (DEMO) trSimStart(trip);
  else if (navigator.geolocation) {
    TR.watch = navigator.geolocation.watchPosition(
      p => trAdd({ t: Date.now(), lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      e => { TR.st.err = e.code === 1 ? 'ยังไม่ได้อนุญาตให้เว็บใช้ตำแหน่ง เปิดได้ที่ตั้งค่าเบราว์เซอร์ > ตำแหน่ง' : 'ยังหาสัญญาณ GPS ไม่เจอ ลองวางมือถือให้เห็นท้องฟ้า'; trRender(); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  } else TR.st.err = 'มือถือเครื่องนี้ไม่รองรับ GPS';
  TR.timer = setInterval(trFlush, 20000); // ส่งทุก 20 วินาที ให้ผู้ดูแลดูได้แบบสด
  TR.tick = setInterval(trRender, 1000);
}
function trAdd(pt) {
  const S0 = TR.st; if (!S0 || pt.acc > 100) return;           // ตัดจุดที่แม่นยำต่ำ
  const L = S0.last;
  if (L) {

    if (d < 0.03 && dt < 15) return;                             // ยังไม่ขยับและยังไม่ครบ 15 วินาที
    if (d >= 0.02 && d / Math.max(dt / 3600, 1e-6) < 200) S0.km += d;

  S0.err = ''; trSave(); trRender();
}
async function trFlush() {
  const S0 = TR.st; if (!S0 || !S0.queue.length) return true;
  const batch = S0.queue.slice(0, 500);
  try {
    await call('track', { tripId: S0.tripId, points: batch });
    S0.queue.splice(0, batch.length); S0.sent = Date.now(); trSave(); trRender();
    return S0.queue.length ? trFlush() : true;
  } catch (e) { S0.err = 'ส่งข้อมูลไม่สำเร็จ ระบบเก็บไว้ในเครื่องและจะลองส่งใหม่'; trRender(); return false; }
}
async function trWake() {
  try { if ('wakeLock' in navigator) { TR.lock = await navigator.wakeLock.request('screen'); TR.wakeOk = true; } else TR.wakeOk = false; }
  catch (e) { TR.wakeOk = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TR.on) { trWake(); trFlush(); } });

  clearInterval(TR.timer); clearInterval(TR.tick); clearInterval(TR.sim);
  TR.watch = TR.timer = TR.tick = TR.sim = null;
  try { if (TR.lock) await TR.lock.release(); } catch (e) {}

}

// โหมดทดลอง: จำลองรถวิ่งตามเส้นทาง 1 วินาที = 1 จุด
function trSimStart(trip) {
  const C = S.data.rules.company;
  let stops = []; try { stops = JSON.parse(trip.stopsJson || '[]').filter(x => x.lat != null && x.lat !== ''); } catch (e) {}
  const path = [C, ...stops.map(x => ({ lat: +x.lat, lng: +x.lng })), C];
  let leg = 1, f = 0, pos = TR.st.last ? { lat: TR.st.last.lat, lng: TR.st.last.lng } : { ...C };
  TR.sim = setInterval(() => {
    if (leg >= path.length) return;
    let target = path[leg];
    if (TR.detour > 0) { target = { lat: C.lat + 0.25, lng: C.lng + 0.3 }; TR.detour--; }
    const d = kmBetween(pos, target), step = 0.7;
    if (d <= step) { pos = { ...target }; if (!TR.detour) leg++; }
    else { pos = { lat: pos.lat + (target.lat - pos.lat) * step / d, lng: pos.lng + (target.lng - pos.lng) * step / d }; }
    TR.simT = Math.max(TR.simT || 0, TR.st.last ? TR.st.last.t : Date.now()) + 60000; // 1 วินาทีจริง = 1 นาทีจำลอง
    trAdd({ t: TR.simT, lat: pos.lat + (Math.random() - .5) * .0008, lng: pos.lng + (Math.random() - .5) * .0008, acc: 10 });
  }, 1000);
}

// วาดเส้นทางแบบไม่ต้องใช้แผนที่ (ใช้ในหน้ากำลังขับ)
function traceSvg(pts, stops, company, w = 340, h = 230) {
  const plan = company ? [company, ...stops, company] : stops;
  const all = [...pts.map(p => ({ lat: p[0], lng: p[1] })), ...plan];
  if (!all.length) return `<svg viewBox="0 0 ${w} ${h}"><text x="${w / 2}" y="${h / 2}" text-anchor="middle" fill="#5E6E64" font-size="14">รอสัญญาณ GPS…</text></svg>`;
  let a = Math.min(...all.map(p => p.lat)), b = Math.max(...all.map(p => p.lat)), c = Math.min(...all.map(p => p.lng)), d = Math.max(...all.map(p => p.lng));
  const k = Math.cos(((a + b) / 2) * Math.PI / 180), pad = 22;
  const sx = (d - c) * k || 0.01, sy = (b - a) || 0.01, sc = Math.min((w - pad * 2) / sx, (h - pad * 2) / sy);
  const X = p => (pad + ((p.lng - c) * k) * sc + ((w - pad * 2) - sx * sc) / 2).toFixed(1);
  const Y = p => (h - pad - (p.lat - a) * sc - ((h - pad * 2) - sy * sc) / 2).toFixed(1);
  const line = arr => arr.map(p => X(p) + ',' + Y(p)).join(' ');
  const real = pts.map(p => ({ lat: p[0], lng: p[1] })), last = real[real.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="เส้นทางที่วิ่ง">
    ${plan.length > 1 ? `<polyline points="${line(plan)}" fill="none" stroke="#9fb7a6" stroke-width="2" stroke-dasharray="5 5"/>` : ''}
    ${real.length > 1 ? `<polyline points="${line(real)}" fill="none" stroke="#1F6B45" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${company ? `<rect x="${X(company) - 7}" y="${Y(company) - 7}" width="14" height="14" rx="3" fill="#16241B"/>` : ''}
    ${stops.map((p, i) => `<circle cx="${X(p)}" cy="${Y(p)}" r="10" fill="#F2C230" stroke="#16241B" stroke-width="2"/><text x="${X(p)}" y="${+Y(p) + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#16241B">${i + 1}</text>`).join('')}
    ${last ? `<circle cx="${X(last)}" cy="${Y(last)}" r="7" fill="#1F6B45" stroke="#fff" stroke-width="3"/>` : ''}
  </svg>`;
}

  html: `<div class="hqpin"><svg viewBox="0 0 44 52" width="44" height="52"><path d="M22 50 L15 41 H8 A6 6 0 0 1 2 35 V8 A6 6 0 0 1 8 2 H36 A6 6 0 0 1 42 8 V35 A6 6 0 0 1 36 41 H29 Z" fill="#16241B" stroke="#fff" stroke-width="2.5"/>
    <g fill="none" stroke="#F2C230" stroke-width="2" stroke-linejoin="round"><path d="M13 33 V13 H24 V33 M24 19 H31 V33 M10 33 H34"/></g>
    <g fill="#F2C230"><rect x="16" y="16" width="2.4" height="2.4"/><rect x="19.6" y="16" width="2.4" height="2.4"/><rect x="16" y="21" width="2.4" height="2.4"/><rect x="19.6" y="21" width="2.4" height="2.4"/><rect x="16" y="26" width="2.4" height="2.4"/><rect x="19.6" y="26" width="2.4" height="2.4"/><rect x="26.5" y="22.5" width="2.2" height="2.2"/><rect x="26.5" y="27" width="2.2" height="2.2"/></g></svg></div>` });
function bearing(a, b) {
  const r = x => x * Math.PI / 180, y = Math.sin(r(b.lng - a.lng)) * Math.cos(r(b.lat)),
    x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lng - a.lng));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const agoText = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s} วินาทีที่แล้ว` : s < 3600 ? `${Math.round(s / 60)} นาทีที่แล้ว` : `${Math.round(s / 3600)} ชม.ที่แล้ว`; };

/** สถานะของเที่ยว: ผ่านจุดไหนแล้ว กำลังไปไหน ออกนอกเส้นทางไหม (pts = [{t,lat,lng}]) */
function tripState(pts, stops, company, R) {
  const visited = stops.map(s => pts.some(p => kmBetween(p, s) < 0.35));
  const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
  let km = 0; for (let i = 1; i < pts.length; i++) { const d = kmBetween(pts[i - 1], pts[i]); if (d >= 0.02) km += d; }
  const st = { visited, last, km, next: visited.indexOf(false), at: -1, off: 0, speed: null, deg: null, stale: 0 };
  if (!last) return st;
  st.at = stops.findIndex(s => kmBetween(last, s) < 0.35);
  if (prev && last.t && prev.t && last.t - prev.t < 5 * 60000) {
    const d = kmBetween(prev, last); st.speed = d / Math.max((last.t - prev.t) / 36e5, 1e-6); if (d > 0.02) st.deg = bearing(prev, last);
  }
  if (company && stops.length) {
    const path = [company, ...stops, company]; let b = Infinity;
    for (let i = 1; i < path.length; i++) b = Math.min(b, segDistKm(last, path[i - 1], path[i]));
    st.off = b > R.offrouteKm ? b : 0;
  }
  st.stale = last.t ? Date.now() - last.t : 0;
  return st;
}
function stateText(st, stops) {
  if (!st.last) return { cls: 'wait', text: 'รอสัญญาณ GPS จากมือถือคนขับ' };
  if (st.stale > 3 * 60000) return { cls: 'stale', text: `ไม่ได้รับตำแหน่ง ${agoText(st.stale).replace('ที่แล้ว', '')} แล้ว` };
  if (st.off) return { cls: 'off', text: `ออกนอกเส้นทาง ห่าง ${st.off.toFixed(1)} กม.` };
  if (st.at >= 0) return { cls: 'ok', text: `อยู่ที่จุดที่ ${st.at + 1} ${stops[st.at].name || ''}` };
  if (st.next >= 0) return { cls: 'ok', text: `กำลังไปจุดที่ ${st.next + 1} ${stops[st.next].name || ''}` };
  return { cls: 'ok', text: 'กำลังกลับบริษัท' };
}
function stepper(stops, st) {
  const dots = [['บริษัท', true], ...stops.map((s, i) => [String(i + 1), st.visited[i]]), ['กลับ', false]];
  const cur = st.next >= 0 ? st.next + 1 : stops.length + 1;
  return `<div class="stepr">${dots.map(([l, done], i) => `${i ? `<span class="sl ${i <= cur && (done || i === cur) ? 'on' : ''}"></span>` : ''}<span class="sd ${done ? 'done' : ''} ${i === cur ? 'cur' : ''}">${l}</span>`).join('')}</div>`;
}
function drawTripLayers(layer, trip, pts, stops, company, st, selected) {
  layer.clearLayers();
  const plan = company ? [company, ...stops, company] : stops;
  if (selected && plan.length > 1) L.polyline(plan.map(p => [p.lat, p.lng]), { color: '#7d8c83', weight: 3, dashArray: '6 9', opacity: .8 }).addTo(layer);
  if (pts.length > 1) {
    L.polyline(pts.map(p => [p.lat, p.lng]), { color: '#ffffff', weight: selected ? 9 : 6, opacity: .9 }).addTo(layer);
    L.polyline(pts.map(p => [p.lat, p.lng]), { color: st.off ? '#B4441A' : '#1F6B45', weight: selected ? 5 : 3, opacity: selected ? 1 : .55 }).addTo(layer);
  }
  if (selected) stops.forEach((s, i) => L.marker([s.lat, s.lng], { icon: stopIcon(i + 1, st.visited[i]), zIndexOffset: 100 }).bindTooltip(esc(s.name || ''), { direction: 'top' }).addTo(layer));
  if (st.last) {
    const state = st.stale > 3 * 60000 ? 'stale' : st.off ? 'off' : 'ok';
    L.marker([st.last.lat, st.last.lng], { icon: carIcon(selected ? '' : trip.plate.split(' ').slice(0, 2).join(' '), state, st.deg), zIndexOffset: 1000 })
      .on('click', () => { MAPS.sel = trip.id; MAPS.userMoved = true; liveDraw(); }).addTo(layer);
  }
}

        <p class="note" id="odoHint">${c.lastOdo != null ? 'คืนรถครั้งก่อนที่ ' + n(c.lastOdo) + ' กม.' : 'แตะที่ตัวเลขเพื่อพิมพ์'}</p></li>
      <li class="st" id="s3"><span class="dot">3</span><h3>ไปทำอะไร</h3>
        <div class="chips" id="chips">${PURPOSES.map(p => `<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join('')}<button class="chip" data-p="">อื่น ๆ</button></div>
        <input id="other" class="f mt" placeholder="พิมพ์งานที่ไปทำ" style="display:none"></li>
      <li class="st" id="s4"><span class="dot">4</span><h3>จะไปที่ไหนบ้าง<small>เรียงตามลำดับ</small></h3>
        <div id="stops"></div>
        <button class="add" id="addStop" type="button">+ เพิ่มจุดแวะ</button>
        <div id="routeBox"></div></li>
    </ol>
    <div class="dock"><button class="btn" id="submit">ยืนยันรับรถ</button></div>`;
  bindPhoto(c, P, 's1');

  // จุดแวะหลายจุด: ค้นหาจาก Google Maps แล้วแตะเลือก
  P.stops = [{ q: '' }];
  const picked = () => P.stops.filter(x => x.pick).map(x => x.pick);
  const allPicked = () => P.stops.length > 0 && P.stops.every(x => x.pick);
  const clearRoute = () => { P.route = null; $('routeBox').innerHTML = ''; $('s4').classList.remove('done'); };
  const drawStops = () => {
    $('stops').innerHTML = P.stops.map((x, i) => x.pick
      ? `<div class="pick"><span class="n">${i + 1}</span><div class="pk"><b>${esc(x.pick.name)}</b><span>${esc(x.pick.address || '')}</span></div>
          <button class="rm" type="button" data-rm="${i}" aria-label="เปลี่ยนสถานที่ที่ ${i + 1}">×</button></div>`
      : `<div class="stop"><span class="n">${i + 1}</span>
          <input class="f" data-i="${i}" value="${esc(x.q)}" placeholder="${i ? 'จุดแวะถัดไป' : 'พิมพ์ชื่อสถานที่ เช่น โฮมโปร บางนา'}" aria-label="สถานที่ที่ ${i + 1}" enterkeyhint="search">
          <button class="btn sm" type="button" data-find="${i}">${x.busy ? '…' : 'ค้นหา'}</button></div>
        ${x.results ? `<div class="res">${x.results.length
          ? x.results.map((r, j) => `<button type="button" data-pick="${i}:${j}"><b>${esc(r.name)}</b><span>${esc(r.address || '')}</span></button>`).join('')
          : '<div class="msg">ไม่พบใน Google Maps ลองพิมพ์ชื่ออื่น หรือวางลิงก์ที่แชร์จากแอป Google Maps</div>'}</div>` : ''}
        ${i === 0 && !x.results ? '<p class="tip">หาไม่เจอ? เปิดแอป Google Maps กดแชร์สถานที่ แล้ววางลิงก์ในช่องนี้ได้</p>' : ''}`).join('');
    $('addStop').style.display = P.stops.length >= 8 ? 'none' : 'block';
    $('stops').querySelectorAll('input[data-i]').forEach(inp => {
      inp.oninput = () => { P.stops[+inp.dataset.i].q = inp.value; };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); find(+inp.dataset.i); } };
    });
  };
  const find = async i => {
    const x = P.stops[i];
    if (!x.q.trim()) return toast('พิมพ์ชื่อสถานที่ก่อน');
    x.busy = true; drawStops();
    try { x.results = await call('place', { q: x.q }); }
    catch (e) { x.results = null; toast(e.message, 5000); }
    x.busy = false; drawStops();
    if (x.results && x.results.length === 1 && /^https?:/.test(x.q)) choose(i, 0); // ลิงก์ได้ผลเดียว เลือกให้เลย
  };
  const choose = (i, j) => {
    P.stops[i].pick = P.stops[i].results[j]; P.stops[i].results = null;
    drawStops(); clearRoute();
    if (allPicked()) calc();
  };
  $('stops').onclick = e => {
    const f = e.target.closest('[data-find]'), pk = e.target.closest('[data-pick]'), rm = e.target.closest('[data-rm]');
    if (f) find(+f.dataset.find);
    if (pk) { const [i, j] = pk.dataset.pick.split(':').map(Number); choose(i, j); }
    if (rm) {
      const i = +rm.dataset.rm;
      if (P.stops.length > 1) P.stops.splice(i, 1); else P.stops[i] = { q: '' };
      drawStops(); clearRoute(); if (allPicked()) calc();
    }
  };
  drawStops();
  $('addStop').onclick = () => {
    P.stops.push({ q: '' }); drawStops(); clearRoute();
    const ins = $app.querySelectorAll('.stop input'); if (ins.length) ins[ins.length - 1].focus();
  };

  const drawRoute = () => {
    const r = P.route; if (!r) return;
    const start = +$('odo').value;
    const legs = r.legs;
    $('routeBox').innerHTML = `<div class="route"><ul class="rt">
      <li class="hq"><span class="nm">${esc(hqName())}</span><div class="ad">จุดเริ่มต้น</div></li>
      ${legs.map((l, i) => `<div class="leg">${n(l.km)} กม.</div>
        ${i < legs.length - 1 ? `<li><span class="nm">${i + 1}. ${esc(l.to)}</span>${l.address ? `<div class="ad">${esc(l.address)}</div>` : ''}</li>` : '<li class="hq"><span class="nm">กลับบริษัท</span></li>'}`).join('')}
      </ul>
      <div class="sum"><span>รวมไป-กลับ<br><span class="small">ขับประมาณ ${Math.floor(r.totalMin / 60) ? Math.floor(r.totalMin / 60) + ' ชม. ' : ''}${r.totalMin % 60} นาที</span></span><b>${n(r.totalKm)} กม.</b></div>
      ${tripCost(c, r.totalKm) ? `<div class="cost">ค่าน้ำมันโดยประมาณ <b>${n(tripCost(c, r.totalKm))} บาท</b> (${c.kmPerLiter} กม./ลิตร × ราคา${fuelLabel(c.fuel)}วันนี้ ${fuelPrice(c.fuel)} บาท)</div>` : ''}
      <div class="expect">${start ? `<p>กลับถึงบริษัท เลขไมล์ควรอยู่ที่ประมาณ</p>${odo(start + r.totalKm, 'lg hl')}` : '<p>กรอกเลขไมล์ในข้อ 2 แล้วจะเห็นว่าตอนกลับควรเป็นเลขเท่าไหร่</p>'}</div>
      ${gmapsLink(picked()) ? `<a class="gmlink" href="${gmapsLink(picked())}" target="_blank" rel="noopener">ตรวจเส้นทางนี้ใน Google Maps ↗</a>` : ''}
      ${r.demo ? '<p class="fake">โหมดทดลองใช้ระยะทางสมมติ ของจริงคำนวณจาก Google Maps</p>' : ''}</div>`;
  };
  const calc = async () => {
    if (!allPicked()) { toast('เลือกสถานที่จาก Google Maps ให้ครบทุกจุดก่อน'); return false; }
    $('routeBox').innerHTML = '<p class="note">กำลังคำนวณระยะทางจาก Google Maps…</p>';
    try { P.route = await call('route', { stops: picked() }); drawRoute(); $('s4').classList.add('done'); return true; }
    catch (e) { $('routeBox').innerHTML = ''; toast(e.message, 5000); return false; }
  };

  bindOdoInput('odo', v => {
    const h = $('odoHint');
    $('s2').classList.toggle('done', v > 0);
    drawRoute();
    if (c.lastOdo == null || !v) { h.className = 'note'; h.textContent = c.lastOdo != null ? 'คืนรถครั้งก่อนที่ ' + n(c.lastOdo) + ' กม.' : ''; return; }
    const g = v - c.lastOdo;
    if (g < 0) { h.className = 'note warn'; h.textContent = `น้อยกว่าตอนคืนรถครั้งก่อน (${n(c.lastOdo)}) ตรวจตัวเลขอีกครั้ง`; }
    else if (g > R.gapKm) { h.className = 'note warn'; h.textContent = `มากกว่าตอนคืนรถครั้งก่อน ${n(g)} กม. ระบบจะแจ้งผู้ดูแล`; }
    else { h.className = 'note ok'; h.textContent = 'ตรงกับตอนคืนรถครั้งก่อน'; }
  });
  $('chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    $('chips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    P.other = b.dataset.p === '';
    P.purpose = b.dataset.p;
    $('other').style.display = P.other ? 'block' : 'none';
    if (P.other) $('other').focus();
    $('s3').classList.add('done');
  };
  $('submit').onclick = async () => {
    const odoV = $('odo').value, purpose = P.other ? $('other').value.trim() : P.purpose;
    if (!P.photo) return toast('ถ่ายรูปหน้าปัดก่อนนะครับ');
    if (!odoV) return toast('กรอกเลขไมล์ก่อนนะครับ');
    if (!purpose) return toast('เลือกว่าไปทำอะไรก่อนนะครับ');
    if (!allPicked()) { $('s4').scrollIntoView({ behavior: 'smooth' }); return toast('ค้นหาและเลือกสถานที่จาก Google Maps ให้ครบทุกจุด'); }
    if (!P.route && !(await calc())) return;
    const stops = picked();
    const b = $('submit'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try {
      const p = await pos;
      const r = await call('checkout', { car: c.id, driver: me(), odo: +odoV, purpose, destination: stops.map(x => x.name).join('\n'), stops,
        photo: P.photo, photoAgeMin: P.photoAgeMin, lat: p?.lat, lng: p?.lng });
      renderDone('รับรถแล้ว', `<p>${esc(c.name)} ออกที่เลขไมล์ ${n(odoV)} กม.</p>
        ${r.expectedKm ? `<div class="expect"><p>ไป-กลับ ${n(r.expectedKm)} กม. กลับถึงบริษัทเลขไมล์ควรอยู่ที่ประมาณ</p>${odo(+odoV + +r.expectedKm, 'lg hl')}</div>` : ''}
        <p class="small mt">กดเริ่มขับเพื่อบันทึกเส้นทาง GPS แล้ววางมือถือเปิดหน้าจอค้างไว้ในรถ</p>`, r.flags,
        { label: 'เริ่มขับ บันทึกเส้นทาง', fn: async () => { S.data = await call('init'); openDrive(c.id); } });
    } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'ยืนยันรับรถ'; }
  };
  window.scrollTo(0, 0);
}

// ---------- คืนรถ ----------
function renderCheckin(c) {
  const t = c.open, R = S.data.rules, P = {}, pos = getPos(), exp = +t.expectedKm;
  const stops = t.destination ? String(t.destination).split('\n') : [];
  header('คืนรถ', renderHome);
  $app.innerHTML = `${carCtx(c)}
    ${trHas(t.id) ? `<div class="gpsrow"><span class="pulse ${trActive(t.id) ? '' : 'off'}"></span>GPS บันทึกไว้ ${TR.st.km.toFixed(1)} กม. จะส่งพร้อมการคืนรถ</div>` : ''}
    <div class="plan"><b>${esc(t.driver)}</b> ออกไป${esc(t.purpose)} ตั้งแต่ ${ftime(t.startTime)}
      ${stops.length ? `<ol>${stops.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}</div>
    <div class="compare">
      <div><p>ออกไปที่</p>${odo(t.startOdo, 'sm')}</div>
      <div><p>ควรกลับมาที่</p>${exp > 0 ? odo(+t.startOdo + exp, 'sm hl') : '<b>–</b>'}</div></div>
    <ol class="steps">
      <li class="st" id="s1"><span class="dot">1</span><h3>ถ่ายรูปหน้าปัด</h3>${photoStep()}</li>
      <li class="st" id="s2"><span class="dot">2</span><h3>เลขไมล์ตอนนี้</h3>${odoInput('odo')}<div id="result"></div></li>
      <li class="st" id="s3"><span class="dot">3</span><h3>เติมน้ำมันไหม</h3>
        <div class="chips" id="fuelChips"><button class="chip on" data-f="0">ไม่ได้เติม</button><button class="chip" data-f="1">เติมน้ำมัน</button></div>
        <div id="fuel" style="display:none">
          <label class="shot rshot" id="rshot"><span id="rph0" style="display:contents">${ICON.cam}ถ่ายรูปใบเสร็จน้ำมัน<span class="small">ระบบจะอ่านลิตรและยอดเงินให้</span></span>
            <img id="rImg" alt="ใบเสร็จน้ำมัน" style="display:none"><input id="receipt" type="file" accept="image/*" capture="environment" hidden></label>
          <div class="rstat" id="rstat"></div>
          ${S.data.fuel ? `<div class="price"><select id="ftype" aria-label="ชนิดน้ำมัน">${Object.keys(S.data.fuel.prices).map(k => `<option value="${k}" ${k === c.fuel ? 'selected' : ''}>${esc(fuelLabel(k))}</option>`).join('')}</select>
            <b id="pnow"></b></div><p class="small" style="margin:6px 2px 0">ราคาน้ำมัน${esc(S.data.fuel.source)}วันนี้ ${esc(S.data.fuel.note)}</p>`
            : '<p class="small">ดึงราคาน้ำมันวันนี้ไม่ได้ กรอกตามใบเสร็จได้เลย</p>'}
          <div class="two mt">
            <div><div class="lbl">กี่ลิตร</div><input id="fl" class="f" type="number" inputmode="decimal" step="0.01"><div class="auto" id="flA"></div></div>
            <div><div class="lbl">กี่บาท</div><input id="fb" class="f" type="number" inputmode="decimal" step="0.01"><div class="auto" id="fbA"></div></div></div>
          <div id="fuelCheck"></div></div>
        <textarea id="note" class="f mt" placeholder="หมายเหตุ (ถ้ามี) เช่น รถติด แวะเพิ่ม"></textarea></li>
    </ol>
    <div class="dock"><button class="btn" id="submit">ยืนยันคืนรถ</button></div>`;
  bindPhoto(c, P, 's1');
  $('s3').classList.add('done');
  bindOdoInput('odo', v => {
    const d = v - t.startOdo, el = $('result');
    $('s2').classList.toggle('done', v >= t.startOdo && v > 0);
    if (!v) { el.innerHTML = ''; return; }
    if (d < 0) { el.innerHTML = `<p class="note warn">ต้องไม่น้อยกว่าตอนออก (${n(t.startOdo)})</p>`; return; }
    const over = exp > 0 && d > exp * (1 + R.extraPct / 100) && d - exp >= R.extraMinKm;
    el.innerHTML = `<div class="result"><span class="small">รอบนี้วิ่งจริง</span><div class="km">${n(d)} กม.</div>
      ${exp > 0 ? `<div class="verdict ${over ? 'warn' : 'ok'}">${d > exp ? `มากกว่าที่ Google Maps คำนวณไว้ ${n(d - exp)} กม.` : `ไม่เกินที่ Google Maps คำนวณไว้ (${n(exp)} กม.)`}${over ? '<br>ช่วยเขียนเหตุผลในหมายเหตุด้วยนะครับ' : ''}</div>` : ''}
      ${tripCost(c, d) ? `<div class="cost">ค่าน้ำมันเที่ยวนี้ประมาณ <b>${n(tripCost(c, d))} บาท</b></div>` : ''}</div>`;
  });
  // เติมน้ำมัน: กรอกลิตรหรือบาทช่องเดียว อีกช่องคำนวณจากราคาจริงวันนี้ให้ ถ้ากรอกเองทั้งสองช่อง จะตรวจว่าตรงกับราคาไหม
  const F = { man: { fl: false, fb: false } };
  const curType = () => $('ftype') ? $('ftype').value : c.fuel;
  const price = () => fuelPrice(curType());
  const fuelCheck = () => {
    const p = price(), L = +$('fl').value, B = +$('fb').value, box = $('fuelCheck');
    if ($('pnow')) $('pnow').innerHTML = p ? `${p.toFixed(2)} <small>บาท/ลิตร</small>` : '–';
    if (!p || !L || !B || !(F.man.fl && F.man.fb)) { box.innerHTML = ''; return; }
    const should = L * p, diff = (B - should) / should * 100;
    box.innerHTML = Math.abs(diff) > 5
      ? `<div class="verdict warn">ยอดเงินไม่ตรงกับราคาวันนี้: ${L} ลิตร ควรประมาณ ${n(Math.round(should))} บาท (ต่าง ${diff > 0 ? '+' : ''}${diff.toFixed(0)}%) ระบบจะแจ้งผู้ดูแล</div>`
      : `<div class="verdict ok">ยอดเงินตรงกับราคาน้ำมันวันนี้</div>`;
  };
  const autoFill = from => {
    const p = price(); F.man[from] = true;
    const to = from === 'fl' ? 'fb' : 'fl';
    if (!p || F.man[to] && $(to).value) { $(from + 'A').textContent = ''; fuelCheck(); return; }
    F.man[to] = false;
    const v = +$(from).value;
    $(to).value = v ? (from === 'fl' ? (v * p).toFixed(2) : (v / p).toFixed(2)) : '';
    $(to + 'A').textContent = v ? 'คำนวณจากราคาวันนี้' : '';
    $(from + 'A').textContent = '';
    fuelCheck();
  };
  $('fl').oninput = () => autoFill('fl');
  $('fb').oninput = () => autoFill('fb');
  if ($('ftype')) $('ftype').onchange = () => { const m = F.man.fl ? 'fl' : F.man.fb ? 'fb' : null; if (m && !(F.man.fl && F.man.fb)) autoFill(m); else fuelCheck(); };
  fuelCheck();
  $('receipt').onchange = async () => {
    const f = $('receipt').files[0]; if (!f) return;
    const st = $('rstat');
    try {
      P.receipt = await readPhoto(f, DEMO ? 700 : 1600, '');
      $('rImg').src = P.receipt; $('rImg').style.display = 'block'; $('rph0').style.display = 'none'; $('rshot').classList.add('has');
    } catch (e) { return toast('เปิดรูปไม่ได้ ลองถ่ายใหม่อีกครั้ง'); }
    st.className = 'rstat'; st.innerHTML = '<span class="spin"></span>กำลังอ่านใบเสร็จ…';
    try {
      const r = await call('receipt', { photo: P.receipt });
      if (!r.found) { st.className = 'rstat warn'; st.textContent = 'อ่านตัวเลขในใบเสร็จไม่ได้ กรอกเองได้เลย (แตะรูปเพื่อถ่ายใหม่)'; return; }
      if (r.liters) $('fl').value = r.liters;
      if (r.baht) $('fb').value = r.baht;
      F.man = { fl: true, fb: true };
      $('flA').textContent = r.liters ? 'อ่านจากใบเสร็จ' : ''; $('fbA').textContent = r.baht ? 'อ่านจากใบเสร็จ' : '';
      st.className = 'rstat ok';
      st.textContent = `อ่านจากใบเสร็จแล้ว ${r.liters ? r.liters + ' ลิตร ' : ''}${r.baht ? n(r.baht) + ' บาท' : ''}${r.price ? ` (${r.price} บาท/ลิตร)` : ''} ตรวจตัวเลขอีกครั้งนะครับ` + (r.demo ? ' [ตัวเลขสมมติในโหมดทดลอง]' : '');
      fuelCheck();
    } catch (e) { st.className = 'rstat warn'; st.textContent = e.message + ' กรอกตัวเลขเองได้เลย'; }
  };
  $('fuelChips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    $('fuelChips').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    $('fuel').style.display = b.dataset.f === '1' ? 'block' : 'none';
    if (b.dataset.f === '0') { $('fl').value = ''; $('fb').value = ''; F.man = { fl: false, fb: false }; $('flA').textContent = $('fbA').textContent = ''; fuelCheck(); }
    else $('fl').focus();
  };
  $('submit').onclick = async () => {
    const odoV = $('odo').value;
    if (!P.photo) return toast('ถ่ายรูปหน้าปัดก่อนนะครับ');
    if (!odoV) return toast('กรอกเลขไมล์ก่อนนะครับ');
    if (+odoV < +t.startOdo) return toast(`เลขไมล์ต้องไม่น้อยกว่า ${n(t.startOdo)}`);
    if (+$('fl').value > 0 && R.requireReceipt && !P.receipt) { $('rshot').scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast('ถ่ายรูปใบเสร็จน้ำมันก่อนนะครับ'); }
    const b = $('submit'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try {
      if (trHas(t.id)) {
        b.textContent = 'กำลังส่งเส้นทาง GPS…';
        if (!(await trStop())) toast('ส่งเส้นทาง GPS บางส่วนไม่สำเร็จ ระบบจะบันทึกเท่าที่มี', 4000);
        b.textContent = 'กำลังบันทึก…';
      }
      const p = await pos;
      const r = await call('checkin', { tripId: t.id, odo: +odoV, photo: P.photo, photoAgeMin: P.photoAgeMin, lat: p?.lat, lng: p?.lng,
        fuelLiters: $('fl').value, fuelBaht: $('fb').value, fuelType: curType(), receipt: +$('fl').value > 0 ? P.receipt : '', note: $('note').value });
      if (trHas(t.id)) trClear();
      renderDone('คืนรถแล้ว', `<p>${esc(c.name)} รอบนี้วิ่ง ${n(r.distance)} กม.${r.fuelCostEst ? `<br>ค่าน้ำมันเที่ยวนี้ประมาณ ${n(r.fuelCostEst)} บาท` : ''}</p><p class="small">ขอบคุณครับ</p>`, r.flags);
    } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'ยืนยันคืนรถ'; }
  };
  window.scrollTo(0, 0);
}

function renderDone(title, html, flags, action) {
  header('รถบริษัท');
  $app.innerHTML = `<div class="done-box"><div class="tick" aria-hidden="true"></div><h2 class="title">${title}</h2>${html}
    ${flags.length ? `<ul class="flags">${flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul><p class="small mt">รายการนี้จะส่งให้ผู้ดูแลตรวจสอบ</p>` : ''}</div>
    ${action ? '<div class="mt" style="max-width:528px;margin:22px auto 0"><button class="btn line" id="home2">ไว้ทีหลัง กลับหน้าแรก</button></div>' : ''}
    <div class="dock"><button class="btn" id="home">${action ? esc(action.label) : 'กลับหน้าแรก'}</button></div>`;
  $('home').onclick = action ? action.fn : boot;
  if ($('home2')) $('home2').onclick = boot;
  window.scrollTo(0, 0);
}

// ---------- รายงาน ----------
async function renderReport() {
  header('รายงานการใช้รถ', boot);
  if (!S.adminPin) {
    $app.innerHTML = `<h2 class="title">สำหรับผู้ดูแล</h2><p class="lead">กรอกรหัสผู้ดูแลเพื่อดูรายงาน</p>
      <input id="apin" class="f" type="password" inputmode="numeric" autocomplete="off" placeholder="รหัสผู้ดูแล" style="font-size:24px;text-align:center">
      <p class="note warn" id="aerr"></p><button class="btn" id="ago">ดูรายงาน</button>`;
    $('ago').onclick = async () => {
      const pin = $('apin').value.trim();
      try { await call('adminCheck', { pin }); S.adminPin = pin; renderReport(); }
      catch (e) { $('aerr').textContent = e.message; }
    };
    $('apin').onkeydown = e => { if (e.key === 'Enter') $('ago').click(); };
    return;
  }
  $app.classList.add('wide');
  $app.innerHTML = '<p class="empty">กำลังโหลด…</p>';
  try {
    S.data = await call('init', { pin: S.adminPin });
    S.trips = await call('trips', { pin: S.adminPin });
  } catch (e) { $app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  S.month = S.month || monthKey(new Date());
  drawReport();
}

function drawReport() {
  header('รายงานการใช้รถ', boot, `<button class="hlink gear" id="hset" aria-label="ตั้งค่า">${ICON.gear} ตั้งค่า</button>`);
  $('hset').onclick = renderSettings;
  const list = S.trips.filter(t => monthKey(t.startTime) === S.month);
  const closed = list.filter(t => t.status === 'closed');
  const flagged = list.filter(t => flagsOf(t).length);
  const pending = flagged.filter(t => t.reviewStatus !== 'done'), reviewed = flagged.filter(t => t.reviewStatus === 'done');
  const sum = (a, k) => a.reduce((s, t) => s + (+t[k] || 0), 0);

  const tripCard = t => {
    const f = flagsOf(t), car = carOf(t.car), exp = +t.expectedKm;
    const stops = t.destination ? String(t.destination).split('\n') : [];
    const ph = [[t.startPhoto, 'รูปเลขไมล์ตอนออก'], [t.endPhoto, 'รูปเลขไมล์ตอนคืน'], [t.receiptPhoto, 'ใบเสร็จน้ำมัน']].filter(x => x[0]).map(([u, label]) => String(u).startsWith('data:')
      ? `<img class="thumb" src="${u}" alt="${label}" title="${label}">` : `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`).join(' ');
    const rv = t.reviewStatus === 'done';
    return `<div class="trip ${f.length ? 'fl' : ''} ${rv ? 'rv' : ''}">
      <div class="top"><span class="who">${esc(t.driver)}, ${esc(car.name)}</span>
        ${t.status === 'open' ? '<span class="badge open">ยังไม่คืน</span>' : `<span class="km">${n(t.distance)} กม.</span>`}</div>
      <div class="ln">${fdt(t.startTime)}${t.endTime ? ' ถึง ' + ftime(t.endTime) : ''}, ${esc(t.purpose)}</div>
      ${t.returnedBy && t.returnedBy !== t.driver ? `<div class="ln">คืนรถโดย ${esc(t.returnedBy)}</div>` : ''}
      ${stops.length ? `<div class="ln">${stops.map((x, i) => `${i + 1}) ${esc(x)}`).join('  ')}</div>` : ''}
      <div class="ln">เลขไมล์ ${n(t.startOdo)} ถึง ${n(t.endOdo) || '…'}${exp > 0 ? `, Google Maps ${n(exp)} กม. (ควรจบที่ ${n(+t.startOdo + exp)})` : ''}</div>
      ${t.fuelCostEst ? `<div class="ln">ค่าน้ำมันตามระยะทางประมาณ ${n(t.fuelCostEst)} บาท</div>` : ''}
      ${t.fuelLiters !== '' && t.fuelLiters != null ? `<div class="ln">เติมน้ำมัน${t.fuelType ? fuelLabel(t.fuelType) : ''} ${(+t.fuelLiters).toFixed(2)} ลิตร${t.fuelBaht ? ' ' + n(t.fuelBaht) + ' บาท' : ''}${t.fuelPrice ? ` (ราคาวันนั้น ${t.fuelPrice} บาท/ลิตร)` : ''}</div>` : ''}
      ${t.receiptLiters || t.receiptBaht ? `<div class="ln">ใบเสร็จระบุ ${t.receiptLiters || '?'} ลิตร ${t.receiptBaht ? n(t.receiptBaht) + ' บาท' : ''}${t.receiptDate ? ' วันที่ ' + esc(t.receiptDate) : ''}</div>` : ''}
      ${t.note ? `<div class="ln">หมายเหตุ: ${esc(t.note)}</div>` : ''}
      ${t.status === 'closed' ? (+t.gpsPoints > 0
        ? `<div class="ln">GPS ${n(t.gpsKm)} กม. จาก ${t.gpsPoints} จุด ขาดช่วงนานสุด ${t.gpsMaxGapMin} นาที${t.gpsOffrouteKm !== '' && t.gpsOffrouteKm != null ? `, ห่างจากเส้นทางที่วางไว้สูงสุด ${n(t.gpsOffrouteKm)} กม.` : ''}</div>
           <button class="btn sm soft mt" data-map="${esc(t.id)}">ดูเส้นทางบนแผนที่</button>`
        : '<div class="ln">ไม่มีข้อมูล GPS</div>') : ''}
      ${f.map(x => `<div class="fx">${esc(x)}</div>`).join('')}
      ${ph ? `<div class="ph">${ph}</div>` : ''}
      ${f.length && t.status === 'closed' ? (rv
        ? `<div class="rvbox"><b>ตรวจแล้ว</b> ${t.reviewAt ? fdt(t.reviewAt) : ''}${t.reviewNote ? `<br>${esc(t.reviewNote)}` : ''} <button class="linkbtn" data-review="${esc(t.id)}">แก้ไข</button></div>`
        : `<button class="btn sm mt" data-review="${esc(t.id)}">ตรวจแล้ว</button>`) : ''}</div>`;
  };
  const drivers = [...new Set([...S.data.drivers, ...list.map(t => t.driver)])].map(d => {
    const ts = list.filter(t => t.driver === d);
    return { d, trips: ts.length, km: sum(ts.filter(t => t.status === 'closed'), 'distance'), flags: ts.filter(t => flagsOf(t).length).length, pend: ts.filter(t => flagsOf(t).length && t.reviewStatus !== 'done').length };
  }).filter(x => x.trips);
  const base = location.href.split(/[?#]/)[0];

  $app.innerHTML = `
    <div class="bar"><input id="month" class="f" type="month" value="${S.month}" aria-label="เดือน"><span class="sp"></span>
      <button class="btn sm line" id="csv">ดาวน์โหลด Excel</button><button class="btn sm" id="settings">ตั้งค่ารถ / พนักงาน / PIN</button><button class="btn sm line" id="logout">ออก</button></div>
    ${S.data.adminDefault && !DEMO ? '<div class="verdict warn hqwarn"><b>PIN ผู้ดูแลยังเป็นค่าเริ่มต้น (9999)</b><br>ใครก็เดาได้ กรุณาเปลี่ยนในหน้าตั้งค่า</div>' : ''}
    <button class="golive" id="golive"><span class="pulse"></span><span><b>ติดตามรถสด</b><br><span class="small">${S.data.cars.filter(c => c.open).length ? `ตอนนี้มีรถออกไป ${S.data.cars.filter(c => c.open).length} คัน ดูตำแหน่งบนแผนที่` : 'ดูตำแหน่งรถบนแผนที่แบบเรียลไทม์'}</span></span><span class="go">›</span></button>
    ${S.data.rules.company
      ? `<div class="hqrow"><span>ที่ตั้งบริษัท: <b>${esc(S.data.rules.company.name || 'ตั้งไว้แล้ว')}</b></span><button class="linkbtn" id="sethq">เปลี่ยน</button></div>`
      : `<div class="verdict warn hqwarn"><b>ยังไม่ได้ตั้งที่ตั้งบริษัท</b><br>ระบบจึงยังคำนวณระยะทาง ตรวจออกนอกเส้นทาง และเช็กจุดคืนรถไม่ได้<div class="mt"><button class="btn sm" id="sethq">ตั้งที่ตั้งบริษัท</button></div></div>`}
    <div class="fleet">${S.data.cars.map(c => {
      const ts = closed.filter(t => t.car === c.id), fl = pending.filter(t => t.car === c.id).length;
      return `<div class="fcar"><div class="top">${plate(c.plate)}${fl ? `<span class="badge bad">ต้องตรวจ ${fl}</span>` : '<span class="badge ok">ปกติ</span>'}</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:10px"><span style="font-family:var(--disp);font-weight:600;font-size:18px">${esc(c.name)}</span><button class="linkbtn" data-edit="1">แก้ไขรถ</button></div>
        <div class="kpis"><div><b>${n(sum(ts, 'distance')) || 0}</b><span>กม.</span></div>
        <div><b>${list.filter(t => t.car === c.id).length}</b><span>ครั้ง</span></div>
        <div><b>${n(sum(ts, 'fuelBaht')) || 0}</b><span>เติมน้ำมัน (บาท)</span></div></div>
        ${sum(ts, 'fuelCostEst') ? `<p class="small" style="margin:10px 0 0">ค่าน้ำมันตามระยะทางที่วิ่ง ประมาณ ${n(sum(ts, 'fuelCostEst'))} บาท</p>` : ''}</div>`;
    }).join('')}</div>
    <h3 class="h2">ต้องตรวจสอบ (${pending.length})</h3>
    ${pending.length ? pending.map(tripCard).join('') : `<div class="empty">${flagged.length ? 'ตรวจครบทุกรายการแล้ว' : 'เดือนนี้ไม่มีรายการผิดปกติ'}</div>`}
    ${reviewed.length ? `<details><summary>ตรวจแล้ว (${reviewed.length})</summary>${reviewed.map(tripCard).join('')}</details>` : ''}
    <h3 class="h2">สรุปรายคน</h3>
    ${drivers.length ? `<table><tr><th>ชื่อ</th><th class="r">ครั้ง</th><th class="r">กม.</th><th class="r">ถูกเตือน</th><th class="r">ยังไม่ตรวจ</th></tr>
      ${drivers.map(x => `<tr><td>${esc(x.d)}</td><td class="r">${x.trips}</td><td class="r">${n(x.km) || 0}</td><td class="r">${x.flags}</td><td class="r">${x.pend ? `<span class="badge bad">${x.pend}</span>` : '0'}</td></tr>`).join('')}</table>` : '<div class="empty">เดือนนี้ยังไม่มีการใช้รถ</div>'}
    <details><summary>การใช้รถทั้งหมด (${list.length})</summary>${list.map(tripCard).join('') || '<div class="empty">เดือนนี้ยังไม่มีการใช้รถ</div>'}</details>
    <details id="qrbox"><summary>QR code ติดในรถ</summary>
      <p class="small">พิมพ์แล้วติดไว้ในรถ พนักงานสแกนแล้วจะเข้าหน้ารับหรือคืนรถคันนั้นทันที</p>
      <div class="qrs">${S.data.cars.map(c => `<div class="qr">${plate(c.plate)}<div class="code" data-u="${esc(base + '?car=' + encodeURIComponent(c.id))}"></div>
        <div style="font-family:var(--disp);font-weight:600">${esc(c.name)}</div><div class="small">สแกนเพื่อรับหรือคืนรถ</div></div>`).join('')}</div>
      <div class="mt"><button class="btn sm line" id="print">พิมพ์ QR code</button></div></details>`;

  $('golive').onclick = renderLive;
  $('settings').onclick = renderSettings;
  $app.querySelectorAll('[data-edit]').forEach(b => b.onclick = renderSettings);
  $('sethq').onclick = () => companySheet();
  $('month').onchange = e => { S.month = e.target.value || monthKey(new Date()); drawReport(); };
  $('logout').onclick = () => { S.adminPin = null; S.trips = null; boot(); };
  $('csv').onclick = () => downloadCsv(list);
  $('print').onclick = () => { document.body.classList.add('printqr'); try { window.print(); } catch (e) { toast('เครื่องนี้สั่งพิมพ์ไม่ได้'); } };
  $app.querySelectorAll('.code').forEach(el => {
    try { new QRCode(el, { text: el.dataset.u, width: 170, height: 170, colorDark: '#16241B' }); } catch (e) { el.textContent = el.dataset.u; }
  });
  $app.querySelectorAll('[data-review]').forEach(b => b.onclick = () => reviewSheet(S.trips.find(t => t.id === b.dataset.review)));
  $app.querySelectorAll('[data-map]').forEach(b => b.onclick = () => showMap(S.trips.find(t => t.id === b.dataset.map)));
  $app.querySelectorAll('.thumb').forEach(i => i.onclick = () => {
    const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${i.src}" alt="">`;
    z.onclick = () => z.remove(); document.body.appendChild(z);
  });
}


// ---------- หน้าตั้งค่า (ผู้ดูแลเท่านั้น) ----------
async function renderSettings() {
  header('ตั้งค่า', renderReport);
  $app.classList.remove('wide');
  $app.innerHTML = '<p class="empty">กำลังโหลด…</p>';
  let st;
  try { st = await call('settingsGet', { pin: S.adminPin }); }
  catch (e) { $app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const E = { cars: st.cars.map(c => ({ ...c })), drivers: st.drivers.map(d => ({ ...d })) };
  const fuelOpts = sel => st.fuelTypes.map(f => `<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${esc(f.label)}</option>`).join('');
  const randPin = () => { let p; do { p = String(Math.floor(100000 + Math.random() * 900000)); } while (E.drivers.some(d => d.pin === p) || p === '999999'); return p; };
  const draw = () => {
    $app.innerHTML = `
      <h2 class="title">ตั้งค่า</h2><p class="lead">เฉพาะผู้ดูแลเท่านั้นที่เข้าหน้านี้ได้ แก้แล้วกดบันทึกด้านล่าง</p>

      <h3 class="h2">ที่ตั้งบริษัท</h3>
      <div class="sbox"><div class="lrow"><div class="lwho"><b>${st.company ? esc(st.company.name || 'ตั้งไว้แล้ว') : 'ยังไม่ได้ตั้ง'}</b>
        <span>${st.company ? `<a href="https://www.google.com/maps?q=${st.company.lat},${st.company.lng}" target="_blank" rel="noopener">ดูตำแหน่งใน Google Maps ↗</a>` : 'ต้องตั้งก่อน ระบบถึงจะคำนวณระยะทางได้'}</span></div>
        <button class="btn sm ${st.company ? 'line' : ''}" id="sHq">${st.company ? 'เปลี่ยน' : 'ตั้งเลย'}</button></div></div>

      <h3 class="h2">รถบริษัท</h3>
      ${E.cars.map((c, i) => `<div class="sbox ${c.active === false ? 'off' : ''}">
        <div class="srow"><div><div class="lbl">รุ่นรถ</div><input class="f" data-c="${i}" data-k="name" value="${esc(c.name)}" placeholder="เช่น Toyota Hilux Revo"></div>
          <div><div class="lbl">ทะเบียน (รวมจังหวัด)</div><input class="f" data-c="${i}" data-k="plate" value="${esc(c.plate)}" placeholder="เช่น กข 1234 กรุงเทพมหานคร"></div></div>
        <div class="srow"><div><div class="lbl">ชนิดน้ำมัน</div><select class="f" data-c="${i}" data-k="fuel">${fuelOpts(c.fuel)}</select></div>
          <div><div class="lbl">กินน้ำมันประมาณ (กม./ลิตร)</div><input class="f" type="number" inputmode="decimal" data-c="${i}" data-k="kmPerLiter" value="${esc(c.kmPerLiter)}"></div></div>
        <label class="tog"><input type="checkbox" data-c="${i}" data-k="active" ${c.active !== false ? 'checked' : ''}> ใช้งานอยู่ <span class="small">(ปิดเมื่อขายรถหรือเลิกใช้ ประวัติเดิมยังอยู่)</span></label>
      </div>`).join('')}
      <button class="add" id="sAddCar" style="padding-left:0">+ เพิ่มรถ</button>

      <h3 class="h2">พนักงานที่ใช้รถ</h3>
      <p class="small" style="margin-top:-6px">PIN ต้องเป็นตัวเลข 4–8 หลักและห้ามซ้ำกัน กด "สุ่ม" เพื่อสร้าง PIN ใหม่ แล้วแจ้งพนักงานแต่ละคนเป็นการส่วนตัว</p>
      ${E.drivers.map((d, i) => `<div class="sbox ${d.active === false ? 'off' : ''}">
        <div class="srow"><div><div class="lbl">ชื่อ</div><input class="f" data-d="${i}" data-k="name" value="${esc(d.name)}" placeholder="ชื่อเล่นหรือชื่อจริง"></div>
          <div><div class="lbl">PIN</div><div class="pinrow"><input class="f" data-d="${i}" data-k="pin" value="${esc(d.pin)}" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn sm line" data-rand="${i}" type="button">สุ่ม</button></div></div></div>
        <label class="tog"><input type="checkbox" data-d="${i}" data-k="active" ${d.active !== false ? 'checked' : ''}> ใช้งานอยู่ <span class="small">(ปิดเมื่อพนักงานลาออก PIN นี้จะเข้าไม่ได้ทันที)</span></label>
      </div>`).join('')}
      <button class="add" id="sAddDrv" style="padding-left:0">+ เพิ่มพนักงาน</button>

      <h3 class="h2">PIN ผู้ดูแล</h3>
      <div class="sbox">${st.adminDefault ? '<p class="note warn" style="text-align:left;margin:0 0 10px">ยังเป็นค่าเริ่มต้น 9999 ควรเปลี่ยน</p>' : ''}
        <div class="srow"><div><div class="lbl">PIN ผู้ดูแลใหม่</div><input class="f" id="sAdm" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="เว้นว่างถ้าไม่เปลี่ยน"></div>
          <div><div class="lbl">พิมพ์ PIN ใหม่อีกครั้ง</div><input class="f" id="sAdm2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div></div>
      <div class="dock"><button class="btn" id="sSave">บันทึกการตั้งค่า</button></div>`;
    $app.querySelectorAll('[data-c]').forEach(el => el.oninput = el.onchange = () => { const c = E.cars[+el.dataset.c]; c[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; if (el.type === 'checkbox') draw(); });
    $app.querySelectorAll('[data-d]').forEach(el => el.oninput = el.onchange = () => { const d = E.drivers[+el.dataset.d]; d[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value.trim(); if (el.type === 'checkbox') draw(); });
    $app.querySelectorAll('[data-rand]').forEach(b => b.onclick = () => { E.drivers[+b.dataset.rand].pin = randPin(); draw(); });
    $('sAddCar').onclick = () => { E.cars.push({ id: '', name: '', plate: '', fuel: 'diesel', kmPerLiter: 12, active: true }); draw(); };
    $('sAddDrv').onclick = () => { E.drivers.push({ name: '', pin: randPin(), active: true }); draw(); };
    $('sHq').onclick = () => companySheet(() => renderSettings());
    $('sSave').onclick = async () => {
      const a1 = $('sAdm').value.trim(), a2 = $('sAdm2').value.trim();
      if (a1 && a1 !== a2) return toast('PIN ผู้ดูแลใหม่ทั้ง 2 ช่องไม่ตรงกัน');
      if (a1 && !/^\d{4,8}$/.test(a1)) return toast('PIN ผู้ดูแลต้องเป็นตัวเลข 4–8 หลัก');
      const b = $('sSave'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
      try {
        await call('settingsSave', { pin: S.adminPin, cars: E.cars, drivers: E.drivers, adminPin: a1 || undefined });
        if (a1) S.adminPin = a1;
        S.data = await call('init', { pin: S.adminPin });
        toast('บันทึกการตั้งค่าแล้ว'); renderReport();
      } catch (e) { toast(e.message, 5000); b.disabled = false; b.textContent = 'บันทึกการตั้งค่า'; }
    };
  };
  draw();
}

// ตั้งที่ตั้งบริษัท: เลื่อนแผนที่ให้หมุดตรงกลางอยู่ที่บริษัท (แบบแอปเรียกรถ)
function companySheet(after) {
  window.__afterHq = typeof after === 'function' ? after : null;
  const cur = S.data.rules.company;
  const o = document.createElement('div'); o.className = 'mapov';
  o.innerHTML = `<div class="maphead"><b>ตั้งที่ตั้งบริษัท</b><button id="hqclose">ปิด</button></div>
    <div style="position:relative;flex:1">
      <div id="hqmap" style="position:absolute;inset:0"></div>
      <div class="centerpin" aria-hidden="true">${hqIcon().options.html}</div>
      <div class="hqsearch"><div class="stop" style="margin:0"><input class="f" id="hqq" placeholder="ค้นหาชื่อบริษัท หรือวางลิงก์ Google Maps" enterkeyhint="search"><button class="btn sm" id="hqfind">ค้นหา</button></div><div id="hqres"></div></div>
    </div>
    <div class="hqfoot">
      <p class="small" style="margin:0 0 10px">เลื่อนแผนที่ให้หมุดตรงกลางอยู่ที่บริษัท หรือกดใช้ตำแหน่งปัจจุบันถ้าคุณอยู่ที่บริษัท</p>
      <input class="f" id="hqname" placeholder="ชื่อเรียก เช่น บริษัท เมืองเกษตร" value="${esc(cur?.name && cur.name !== 'บริษัท' ? cur.name : '')}">
      <div class="two mt"><button class="btn line" id="hqhere">ใช้ตำแหน่งปัจจุบัน</button><button class="btn" id="hqsave">บันทึกตำแหน่งนี้</button></div></div>`;
  document.body.appendChild(o);
  $('hqclose').onclick = () => o.remove();
  if (!window.L) { $('hqmap').innerHTML = '<p class="empty" style="margin:16px">โหลดแผนที่ไม่ได้ ใช้ปุ่ม "ใช้ตำแหน่งปัจจุบัน" แทนได้</p>'; }
  const m = window.L ? makeMap('hqmap') : null;
  if (m) m.setView(cur ? [cur.lat, cur.lng] : [13.7563, 100.5018], cur ? 17 : 11);
  let picked = null; // ใช้เมื่อไม่มีแผนที่
  $('hqhere').onclick = async () => {
    $('hqhere').textContent = 'กำลังหาตำแหน่ง…';
    const p = await getPos();
    $('hqhere').textContent = 'ใช้ตำแหน่งปัจจุบัน';
    if (!p) return toast('หาตำแหน่งไม่ได้ ตรวจว่าอนุญาตให้เว็บใช้ตำแหน่งแล้ว', 4000);
    picked = p; if (m) m.setView([p.lat, p.lng], 18); else toast('ได้ตำแหน่งแล้ว กดบันทึกได้เลย');
  };
  const find = async () => {
    const q = $('hqq').value.trim(); if (!q) return;
    $('hqres').innerHTML = '<div class="res"><div class="msg" style="color:var(--muted)">กำลังค้นหา…</div></div>';
    try {
      const rs = await call('place', { q, pin: S.adminPin });
      $('hqres').innerHTML = `<div class="res">${rs.length ? rs.map((r, i) => `<button type="button" data-i="${i}"><b>${esc(r.name)}</b><span>${esc(r.address || '')}</span></button>`).join('') : '<div class="msg">ไม่พบ ลองพิมพ์ชื่ออื่น หรือวางลิงก์จาก Google Maps</div>'}</div>`;
      $('hqres').querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
        const r = rs[+b.dataset.i]; picked = r; $('hqres').innerHTML = '';
        if (!$('hqname').value) $('hqname').value = r.name;
        if (m) m.setView([r.lat, r.lng], 18);
      });
    } catch (e) { $('hqres').innerHTML = ''; toast(e.message, 4000); }
  };
  $('hqfind').onclick = find;
  $('hqq').onkeydown = e => { if (e.key === 'Enter') find(); };
  $('hqsave').onclick = async () => {
    const c = m ? m.getCenter() : picked;
    if (!c) return toast('เลือกตำแหน่งก่อนนะครับ');
    try {
      const r = await call('setCompany', { pin: S.adminPin, lat: c.lat, lng: c.lng, name: $('hqname').value.trim() || 'บริษัท' });
      S.data.rules.company = r; o.remove(); (window.__afterHq || drawReport)(); toast('บันทึกที่ตั้งบริษัทแล้ว');
    } catch (e) { toast(e.message, 4000); }
  };
}

// ผู้ดูแลบันทึกว่าตรวจรายการแล้ว พร้อมหมายเหตุ
function reviewSheet(t) {
  const o = document.createElement('div'); o.className = 'overlay';
  const quick = ['สอบถามแล้ว มีเหตุผลที่รับได้', 'ตักเตือนแล้ว', 'ให้ชดใช้ค่าน้ำมันแล้ว', 'ข้อมูลผิดพลาดจากระบบ'];
  o.innerHTML = `<div class="sheet" role="dialog" aria-label="บันทึกการตรวจ">
    <p style="margin-bottom:6px">ตรวจรายการนี้แล้ว</p>
    <div class="small" style="margin-bottom:12px">${esc(t.driver)}, ${esc(carOf(t.car).name)} ${fdt(t.startTime)}</div>
    <div class="chips" id="rq">${quick.map(q => `<button class="chip" type="button">${esc(q)}</button>`).join('')}</div>
    <textarea id="rnote" class="f mt" placeholder="บันทึกผลการตรวจ (ถ้ามี)">${esc(t.reviewNote || '')}</textarea>
    <div class="two mt"><button class="btn line" id="rcancel">ยกเลิก</button><button class="btn" id="rsave">บันทึก</button></div>
    ${t.reviewStatus === 'done' ? '<button class="linkbtn mt" id="rundo" style="display:block;margin:12px auto 0">ย้ายกลับไปรายการที่ต้องตรวจ</button>' : ''}</div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.onclick = e => { if (e.target === o) close(); };
  $('rcancel').onclick = close;
  $('rq').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; const v = $('rnote').value.trim(); $('rnote').value = v ? v + ' ' + b.textContent : b.textContent; };
  const save = async undo => {
    try {
      const r = await call('review', { pin: S.adminPin, tripId: t.id, note: $('rnote').value, undo });
      Object.assign(t, { reviewStatus: r.reviewStatus, reviewNote: r.reviewNote, reviewAt: r.reviewAt });
      close(); drawReport(); toast(undo ? 'ย้ายกลับไปรายการที่ต้องตรวจแล้ว' : 'บันทึกว่าตรวจแล้ว');
    } catch (e) { toast(e.message, 4000); }
  };
  $('rsave').onclick = () => save(false);
  if ($('rundo')) $('rundo').onclick = () => save(true);
}

function downloadCsv(list) {
  const cols = [['startTime', 'เวลารับรถ'], ['endTime', 'เวลาคืนรถ'], ['car', 'รถ'], ['driver', 'ผู้ใช้'], ['purpose', 'งาน'], ['destination', 'ปลายทาง'],
    ['startOdo', 'ไมล์เริ่ม'], ['endOdo', 'ไมล์จบ'], ['distance', 'ระยะทาง (กม.)'], ['expectedKm', 'ระยะที่ควรเป็น (กม.)'],
    ['fuelLiters', 'เติมน้ำมัน (ลิตร)'], ['fuelBaht', 'เติมน้ำมัน (บาท)'], ['fuelPrice', 'ราคาน้ำมันวันนั้น (บาท/ลิตร)'], ['fuelCostEst', 'ค่าน้ำมันตามระยะ (บาท)'], ['note', 'หมายเหตุ'], ['flags', 'แจ้งเตือน'], ['startPhoto', 'รูปรับรถ'], ['endPhoto', 'รูปคืนรถ'], ['receiptPhoto', 'รูปใบเสร็จ'], ['receiptLiters', 'ใบเสร็จ (ลิตร)'], ['receiptBaht', 'ใบเสร็จ (บาท)'], ['returnedBy', 'คืนรถโดย'], ['reviewStatus', 'ตรวจแล้ว'], ['reviewNote', 'บันทึกการตรวจ']];
  const val = (t, k) => {
    let v = t[k] ?? '';
    if (k === 'car') v = carOf(v).name + ' ' + carOf(v).plate;
    if ((k === 'startTime' || k === 'endTime') && v) v = new Date(v).toLocaleString('th-TH');
    if (/Photo$/.test(k) && String(v).startsWith('data:')) v = '';
    return '"' + String(v).replace(/"/g, '""').replace(/\n/g, ' ') + '"';
  };
  const csv = '﻿' + [cols.map(c => c[1]).join(','), ...list.map(t => cols.map(c => val(t, c[0])).join(','))].join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `การใช้รถ-${S.month}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { toast('ดาวน์โหลดไม่ได้ในหน้านี้'); }
}


window.addEventListener('afterprint', () => document.body.classList.remove('printqr'));
boot();
